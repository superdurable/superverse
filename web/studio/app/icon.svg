<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dex">
  <!-- Pipe D, the same small cut as components/shell/DexMark.tsx (dex-ui logo/pipe-d/svg/favicon.svg).
       Colours are literal: a favicon cannot read the app's custom properties. On a dark tab bar the
       bar goes near-white and the chevron lifts, where the light colours would otherwise disappear. -->
  <style>
    .bar { stroke: #00321b }
    .chevron { stroke: #008650 }
    @media (prefers-color-scheme: dark) {
      .bar { stroke: #f6f8f4 }
      .chevron { stroke: #70eea9 }
    }
  </style>
  <path class="bar" d="M 13.5 12 V 52" fill="none" stroke-width="12" stroke-linecap="round"/>
  <path class="chevron" d="M 30.5 12 L 50.5 32 L 30.5 52" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
