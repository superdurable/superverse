<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dex">
  <!-- Branch D, the same small cut as components/shell/DexMark.tsx (dex-ui logo/branch-d/svg/favicon.svg).
       Flats are literal: a favicon cannot read the app's custom properties. Both lift on a dark tab bar,
       where the light track would otherwise be invisible. -->
  <style>
    .track { stroke: #00321b }
    .node { fill: #00321b }
    .head { fill: #008650 }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #42845f }
      .node { fill: #42845f }
      .head { fill: #70eea9 }
    }
  </style>
  <path class="track" d="M 17.25 16 V 48 M 17.25 16 H 29.25 A 16 16 0 0 1 45.25 32 A 16 16 0 0 1 29.25 48 H 17.25" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="node" cx="17.25" cy="16" r="8"/>
  <circle class="node" cx="17.25" cy="48" r="8"/>
  <circle class="head" cx="45.25" cy="32" r="10"/>
</svg>
