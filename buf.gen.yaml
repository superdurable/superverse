version: v2
clean: true
inputs:
  - directory: api
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: module=github.com/superdurable/superversev2/gen
  - local: [go, tool, protoc-gen-go-grpc]
    out: gen
    opt: module=github.com/superdurable/superversev2/gen
