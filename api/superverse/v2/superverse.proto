// Run IDs are diagnostic selectors only and never select a business resource or start target.
service FlowDiagnosticsService {
  rpc GetFlowSummary(GetFlowSummaryRequest) returns (GetFlowSummaryResponse);
  rpc GetFlowState(GetFlowStateRequest) returns (GetFlowStateResponse);
  rpc GetFlowHistory(GetFlowHistoryRequest) returns (GetFlowHistoryResponse);
  // A unary long poll for history after after_event_id.
  rpc WaitFlowHistory(WaitFlowHistoryRequest) returns (WaitFlowHistoryResponse);
  rpc ReadFlowStream(ReadFlowStreamRequest) returns (ReadFlowStreamResponse);
  rpc LoadFlowBlobs(LoadFlowBlobsRequest) returns (LoadFlowBlobsResponse);
  rpc StopFlow(StopFlowRequest) returns (StopFlowResponse);
  rpc DeleteFlowChannelMessage(DeleteFlowChannelMessageRequest) returns (DeleteFlowChannelMessageResponse);
  // The Dex ResetFlow call.
  rpc TimeTravelFlow(TimeTravelFlowRequest) returns (TimeTravelFlowResponse);
}

message GetFlowSummaryRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  CallerContext caller = 100;
}

message GetFlowSummaryResponse {
  FlowApiDocument document = 1;
}

message GetFlowStateRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  CallerContext caller = 100;
}

message GetFlowStateResponse {
  FlowApiDocument document = 1;
}

message GetFlowHistoryRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  string page_token = 4;
  int32 page_size = 5;
  int64 after_event_id = 6;
  CallerContext caller = 100;
}

message GetFlowHistoryResponse {
  FlowApiDocument document = 1;
}

message WaitFlowHistoryRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  int64 after_event_id = 6;
  CallerContext caller = 100;
}

message WaitFlowHistoryResponse {
  FlowApiDocument document = 1;
}

message ReadFlowStreamRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string stream_name = 3;
  string resume_token = 4;
  string flow_type = 5;
  CallerContext caller = 100;
}

message ReadFlowStreamResponse {
  FlowApiDocument document = 1;
}

message LoadFlowBlobsRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  repeated FlowBlobReference values = 3;
  CallerContext caller = 100;
}

message LoadFlowBlobsResponse {
  FlowApiDocument document = 1;
}

message StopFlowRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  int32 stop_type = 4;
  string reason = 5;
  CallerContext caller = 100;
}

message StopFlowResponse {
  FlowApiDocument document = 1;
}

message DeleteFlowChannelMessageRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  string channel_name = 4;
  string message_id = 5;
  CallerContext caller = 100;
}

message DeleteFlowChannelMessageResponse {
  FlowApiDocument document = 1;
}

message TimeTravelFlowRequest {
  FlowApiContext context = 1;
  string flow_id = 2;
  string run_id = 3;
  int32 time_travel_type = 4;
  string reason = 5;
  string step_type = 6;
  string step_execution_id = 7;
  string history_event_time = 8;
  int32 step_method = 9;
  CallerContext caller = 100;
}

message TimeTravelFlowResponse {
  FlowApiDocument document = 1;
}

// The connection names of the target's configuration scope: their TeamSpace connection selections,
// connector UI sessions, trigger bindings and Step settings.
service ConnectorService {
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc SelectTeamSpaceConnection(SelectTeamSpaceConnectionRequest) returns (SelectTeamSpaceConnectionResponse);
  rpc ReleaseUnusedConnections(ReleaseUnusedConnectionsRequest) returns (ReleaseUnusedConnectionsResponse);
  rpc StartConnectorUiSession(StartConnectorUiSessionRequest) returns (StartConnectorUiSessionResponse);
  rpc InvokeProviderCommand(InvokeProviderCommandRequest) returns (InvokeProviderCommandResponse);
  rpc SaveTriggerBinding(SaveTriggerBindingRequest) returns (SaveTriggerBindingResponse);
  rpc SaveOperationConfiguration(SaveOperationConfigurationRequest) returns (SaveOperationConfigurationResponse);
}

message ListConnectionsRequest {
  FlowApiContext context = 1;
  CallerContext caller = 100;
}

message ListConnectionsResponse {
  FlowApiDocument document = 1;
}

// Selects the TeamSpace connection of one connection name in the target's scope: the Preview head,
// or Live's next-publish layer. follow_preview, on the layer only, removes Live's own selection so
// the name follows Preview again; it names no connection, and a connection tied to one address is
// refused with CONFIGURATION_ITEM_CANNOT_FOLLOW.
message SelectTeamSpaceConnectionRequest {
  FlowApiContext context = 1;
  string connector_id = 2;
  string connection_name = 3;
  string team_space_connection_id = 4;
  bool follow_preview = 5;
  CallerContext caller = 100;
}

message SelectTeamSpaceConnectionResponse {
  FlowApiDocument document = 1;
}

// Removes the Project's Live usages that the current Live version does not select; refused while a
// deployment runs. The target is the Live scope.
message ReleaseUnusedConnectionsRequest {
  FlowApiContext context = 1;
  CallerContext caller = 100;
}

message ReleaseUnusedConnectionsResponse {
  FlowApiDocument document = 1;
}

message StartConnectorUiSessionRequest {
  FlowApiContext context = 1;
  string connector_id = 2;
  string connection_name = 3;
  CallerContext caller = 100;
}

message StartConnectorUiSessionResponse {
  FlowApiDocument document = 1;
}

message InvokeProviderCommandRequest {
  FlowApiContext context = 1;
  string session_nonce = 2;
  string command_id = 3;
  map<string, string> parameters = 4;
  CallerContext caller = 100;
}

message InvokeProviderCommandResponse {
  FlowApiDocument document = 1;
}

// follow_preview, on Live's next-publish layer only, removes Live's own binding so it follows Preview.
message SaveTriggerBindingRequest {
  FlowApiContext context = 1;
  string connector_id = 2;
  string connection_name = 3;
  string trigger_name = 4;
  string binding_name = 5;
  bytes configuration_json = 6;
  bool follow_preview = 7;
  CallerContext caller = 100;
}

message SaveTriggerBindingResponse {
  FlowApiDocument document = 1;
}

// follow_preview, on Live's next-publish layer only, removes Live's own Step setting so it follows
// Preview.
message SaveOperationConfigurationRequest {
  FlowApiContext context = 1;
  string connector_id = 2;
  string connection_name = 3;
  string operation_id = 4;
  string flow_type = 5;
  string step_type = 6;
  bytes configuration_json = 7;
  bool follow_preview = 8;
  CallerContext caller = 100;
}

message SaveOperationConfigurationResponse {
  FlowApiDocument document = 1;
}

// The application environment of the target's configuration scope. It is a service of its own
// because ConnectorService would exceed 10 RPCs and ProjectService serves the browser directly.
service ApplicationEnvironmentService {
  rpc GetApplicationEnvironment(GetApplicationEnvironmentRequest) returns (GetApplicationEnvironmentResponse);
  rpc SaveApplicationEnvironment(SaveApplicationEnvironmentRequest) returns (SaveApplicationEnvironmentResponse);
}

message GetApplicationEnvironmentRequest {
  FlowApiContext context = 1;
  CallerContext caller = 100;
}

message GetApplicationEnvironmentResponse {
  FlowApiDocument document = 1;
}

// follow_preview, on Live's next-publish layer only, names the variables whose own value Live drops
// so that they follow Preview; a secret is refused with CONFIGURATION_ITEM_CANNOT_FOLLOW.
message SaveApplicationEnvironmentRequest {
  FlowApiContext context = 1;
  map<string, string> values = 2;
  map<string, string> secrets = 3;
  repeated string remove = 4;
  repeated string follow_preview = 5;
  CallerContext caller = 100;
}

message SaveApplicationEnvironmentResponse {
  FlowApiDocument document = 1;
}

// The served application a Flow API request addresses: Live Runs name a Deployment, Preview Runs
// the Sandbox instance of the Project's Session (workspace_request_id and generation). A
// configuration request names neither; its prepared source and the revisions its form was read at
// fence it. next_publish addresses Live's next-publish layer, as ProjectConfigurationTarget does.
message FlowApiTarget {
  string project_id = 1;
  ProjectScope scope = 2;
  string release_id = 4;
  string deployment_id = 5;
  string workspace_request_id = 6;
  uint64 generation = 7;
  bool next_publish = 8;
}

// The target and the revisions the page observed; Go re-reads the target's authority and rejects
// a stale revision.
message FlowApiContext {
  FlowApiTarget target = 1;
  string definition_revision = 2;
  uint64 app_manifest_revision = 3;
  uint64 configuration_revision = 4;
  uint64 credential_revision = 5;
}

// FDG and renderer payloads keep exact JSON numbers across the generated transport, so the
// document is JSON bytes with the HTTP status the Flow UI expects.
message FlowApiDocument {
  bytes json = 1;
  uint32 http_status = 2;
}

message FlowSearchFilter {
  string field = 1;
  string operator = 2;
  bytes values_json = 3;
}

message FlowBlobReference {
  string id = 1;
  string kind = 2;
}
