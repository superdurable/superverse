# Explicit shared-login opt-in for the local Kind browser and gRPC lane.
studio:
  publicOrigin: http://studio.kind.localhost:23000
accounts:
  loginHost:
    handoffEnabled: true
    exchangeEnabled: true
    publicOrigin: http://login.kind.localhost:23000
    clients:
      studio:
        enabled: true
        origin: http://studio.kind.localhost:23000
        redirectURI: http://studio.kind.localhost:23000/api/auth/callback
