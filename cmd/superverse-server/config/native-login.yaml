# Explicit opt-in for the local shared-login browser and gRPC acceptance.
studio:
  publicOrigin: http://studio.native.localhost:21000
accounts:
  loginHost:
    handoffEnabled: true
    exchangeEnabled: true
    publicOrigin: http://login.native.localhost:21000
    clients:
      studio:
        enabled: true
        origin: http://studio.native.localhost:21000
        redirectURI: http://studio.native.localhost:21000/api/auth/callback
