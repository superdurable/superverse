name: remote-long-continuation
title: "Long remote platform continuation"
description: "Strict retained remote replay and an actual platform Sandbox read after a long handoff."
category: agent_feature
test_action: "Launch only after remote-long-tail and the canonical executor switch."
arguments:
  head: unset
  notice: unset
  summary: none
  budget: "400000"
  task: "unset"
  bytecase: "0"
  candidate_bytes: "unset"
  candidate_digest: "unset"
  candidate_count: "unset"
  predecessors_digest: "unset"
  predecessors_count: "unset"
inputs:
  - label: "Continue after the long remote interval"
    message: "Read the long remote handoff proof with the Superverse agent."
    replies:
      - expect_handoff: true
        text: "Reading the retained remote proof on the platform."
        tool_uses:
          - name: read
            input: {path: /workspace/raexec-long-handoff.txt}
        expect_result_contains: ["Long remote handoff proof"]
      - text: "Long remote handoff replay and platform continuation are coherent."
