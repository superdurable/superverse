# The automatic Preview deployment of a push: the script writes a note from
# the note argument, restores the template's dependencies, as a fresh workspace
# has none, and pushes through the real commit gate. When the turn ends the
# Session hands the pushed commit to its Preview, which deploys exactly that
# commit by itself. A Preview that serves reports ready, which never reaches
# the conversation, so the scenario has no reply to it. Each run writes the
# note its argument names, so every push of the same Project changes source.
name: preview-autodeploy
title: "Push and deploy the Preview"
description: "Configure the Preview's summary-model connection first. Pushes a note through the commit gate; the Preview then deploys the pushed commit by itself, and its ready outcome reaches no conversation."
category: project_feature
arguments:
  note: Mock deployment
inputs:
  - label: "Push a change"
    message: "Add a deployment note and push it."
    replies:
      - text: "Writing the deployment note."
        tool_uses:
          - name: write
            input: {path: preview-deploy-note.md, content: "{{note}}\n"}
      - text: "Restoring the application's dependencies, as the template's instructions say."
        tool_uses:
          - name: bash
            input: {command: "make bootstrap", description: "Restore the application's dependencies", timeout_seconds: 600}
      - text: "Running the source checks and pushing the note."
        tool_uses:
          - name: commit_and_push
            input:
              summary: "Add the deployment note {{note}}"
              verification:
                - "preview-deploy-note.md holds the note {{note}}"
      - text: "The note is pushed. The Preview deploys the pushed commit by itself; its outcome arrives on its own."
