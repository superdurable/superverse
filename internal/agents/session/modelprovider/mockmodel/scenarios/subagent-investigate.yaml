# An investigate subagent: start_agent answers at once with the task ID and the
# turn ends, while the subagent's own script greps in its worktree, a snapshot of
# the workspace, and reports. Its task notification opens an automatic turn that
# relays the report. The subagent's first command pauses so its report arrives
# after the first turn ended, and a test checks the admission of the running
# subagent meanwhile. It changes nothing in the workspace.
name: subagent-investigate
title: "Subagent investigation"
description: "An investigate subagent finds the page heading in its own worktree and reports; its notification opens an automatic turn."
category: agent_feature
inputs:
  - label: "Delegate the investigation"
    message: "Find out where the page heading is defined, in the background."
    replies:
      - text: "Delegating the investigation to a subagent."
        tool_uses:
          - name: start_agent
            input:
              description: "Find the page heading"
              kind: investigate
              prompt: "Find the file and the line that define the application's page heading and report both. [[subagent:subagent-investigate/heading]]"
        expect_result_contains:
          - "\"task_id\":\"agent-"
          - "\"base_commit\":\""
      - text: "A subagent looks for the page heading; its report arrives as a notification."
      - text: "The subagent reported that web/src/App.tsx defines the page heading."
        notification: task
subagents:
  heading:
    kind: investigate
    replies:
      - text: "Waiting for the workspace to settle, then searching the web source."
        tool_uses:
          - name: bash
            input: {command: "sleep 20; grep -rn '<h1>' web/src", description: "Find the page heading"}
        expect_result_contains:
          - "web/src/App.tsx"
          - "Text Summary"
      - text: "web/src/App.tsx defines the page heading on line 51: <h1>Text Summary</h1>."
