# A start_agent call that steering supersedes before its subagent starts.
# Input 1 reads the page on the Session's instance. The test then removes the
# instance as a lost node does, so input 2's start_agent finds the workspace
# unreachable and waits for the instance the Session provisions next, while
# the test steers input 3: the call is answered superseded, no subagent starts
# and its record goes away, and the steered turn answers.
name: subagent-steered-start
title: "Subagent start superseded by steering"
description: "A start_agent call waits for a new instance and a steered message supersedes it; no subagent starts."
category: agent_feature
test_action: "removes the Session's instance after input 1 and steers input 3 while input 2's start waits"
inputs:
  - label: "Read the page heading"
    message: "Show me the page heading."
    replies:
      - text: "Reading the page."
        tool_uses:
          - name: read
            input: {path: web/src/App.tsx}
        expect_result_contains:
          - "<h1>Text Summary</h1>"
      - text: "The page heading reads Text Summary."
  - label: "Delegate after the instance is gone"
    message: "Investigate the build in the background."
    replies:
      - text: "Delegating the investigation to a subagent."
        tool_uses:
          - name: start_agent
            input:
              description: "Investigate the build"
              kind: investigate
              prompt: "Report what the build prints. [[subagent:subagent-steered-start/build]]"
        expect_failure: true
        expect_failure_text: "Error: superseded_by_steered_user_message"
  - label: "Steer away from the delegation"
    message: "Never mind the investigation; tell me the heading again."
    replies:
      - text: "The page heading reads Text Summary; I started no investigation."
subagents:
  build:
    kind: investigate
    replies:
      - text: "The build prints nothing."
