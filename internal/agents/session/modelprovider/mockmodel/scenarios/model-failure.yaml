# The first model call is rejected the way the API rejects an invalid request.
# The turn records the failure and the Session waits for the user.
name: model-failure
title: "Rejected model call"
description: "The first model call is rejected as an invalid request; the turn records the failure."
category: platform_error
inputs:
  - label: "Fail the model call"
    message: "Fail the model call."
    replies:
      - error: {status: 400, type: invalid_request_error, message: "The mock model rejected this request."}
