name: remote-switchback
title: "Work while the local agent waits"
description: "A mock Platform turn after a real remote handoff, before the same connection resumes."
category: agent_feature
test_action: "Pair, activate and park the real remote endpoint before input 1; then resume the same connection."
arguments:
  head: unset
inputs:
  - label: "Complete the Platform turn"
    message: "Complete the Platform work while my local agent waits."
    replies:
      - expect_handoff: true
        text: "The Platform switchback turn is complete."
