name: custom-endpoint-handoff
title: "Custom endpoint executor handoff"
description: "A fresh continuation after bounded history replay at an executor or credential boundary."
category: agent_feature
arguments:
  head: unset
inputs:
  - label: "Continue the retained conversation"
    message: "Continue after the executor or endpoint changed."
    replies:
      - expect_handoff: true
        text: "The custom endpoint replacement continues with earlier context as text."
