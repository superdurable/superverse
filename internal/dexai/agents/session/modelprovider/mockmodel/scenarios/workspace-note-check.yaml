# Checks that the note workspace-note left is still in the workspace with the
# same text, [[scenario-arg:note=...]]. The command exits 0 only for an exact
# line match, so the test reads the outcome from the tool result's exit code.
name: workspace-note-check
title: "Note check"
description: "Checks that the note of workspace-note is still in the workspace."
category: agent_feature
arguments:
  note: Mock note
inputs:
  - label: "Check the note"
    message: "Check the workspace note."
    replies:
      - text: "Checking the workspace note."
        tool_uses:
          - name: bash
            input: {command: "grep -qxF -- '{{note}}' sandbox-deadline-note.txt", description: "Check the workspace note"}
      - text: "The note check finished."
