name: model-billing-error
title: "Model provider billing problem"
description: "The provider refuses the first call because the account has a billing problem."
category: platform_error
inputs:
  - label: "Encounter a provider billing problem"
    message: "Ask the model with a provider billing problem."
    replies:
      - error: {status: 402, type: billing_error, message: "The account has a payment problem."}
