# After a recorded card the user asks for one more feature and drops another
# (input 2). That is a large change: the revised card keeps R1 and R3 exactly as
# recorded, removes R2 without reusing its number and adds R4, and it is
# recorded as the next version. The work that follows covers only that change:
# R4 and the removal of R2. When the user asks for the links again (input 3),
# the first card gives them R2 back, which the Session refuses because a
# removed number is never reused; the refusal names R5, the corrected card
# numbers them R5, and it is recorded as the version after. The
# script touches no workspace file, so a Session can run it on any READY Project.
name: requirements-amended
title: "Requirements amended"
description: "A recorded card, then a request that adds a feature and drops one: the revised card keeps R1 and R3, removes R2 without reusing its number and adds R4; a card that gives R2 back is refused, and the restored feature becomes R5."
category: project_feature
inputs:
  - label: "Describe the application"
    message: "Plan a release tracker."
    replies:
      - thinking: "A new application, so I show the requirements before I write any code, then keep building."
        text: "Here is what I will build. I am starting now; tell me in the chat if anything should change."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists the latest releases of the organization's repositories."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R2, text: "Each release links to its source."}
                - {id: R3, text: "Each release shows its version and publication date."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days."]
      - tool_uses:
          - name: write_todos
            input:
              todos:
                - {content: "R1: Build the release list", status: in_progress}
                - {content: "R2: Link each release to its source", status: pending}
                - {content: "R3: Show each release's version and date", status: pending}
      - text: "The requirements are recorded as version 1, and I will build exactly these features."
  - label: "Add a feature and drop one"
    message: "Add a filter by repository to this app, and drop the links to the sources."
    replies:
      - thinking: "A filter adds a feature and dropping the links removes R2, so the recorded requirements change: the revised card keeps R1 and R3 as they are, removes R2 without reusing its number and adds R4."
        text: "A filter by repository adds a feature and dropping the links removes R2, so here are the revised requirements: R1 and R3 stay as recorded, R2 is removed and its number is not reused, and R4 is new. I am building the change now."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists the latest releases of the organization's repositories and filters them by repository."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R3, text: "Each release shows its version and publication date."}
                - {id: R4, text: "A visitor filters the list by repository name."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days.", "Typing a repository name narrows the list."]
      - tool_uses:
          - name: write_todos
            input:
              todos:
                - {content: "R4: Filter the list by repository name", status: in_progress}
                - {content: "Remove the source links of R2", status: pending}
      - text: "The revised requirements add R4 and remove R2, and R1 and R3 stay as recorded, so the work that follows is only the repository filter and the removal of the source links."
  - label: "Bring a dropped feature back"
    message: "Bring back the links to the sources."
    replies:
      - text: "Here are the revised requirements with the source links back."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists the latest releases of the organization's repositories, filters them by repository and links them to their sources."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R2, text: "Each release links to its source."}
                - {id: R3, text: "Each release shows its version and publication date."}
                - {id: R4, text: "A visitor filters the list by repository name."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days.", "Typing a repository name narrows the list."]
        expect_failure: true
        expect_failure_text: "Error: invalid_user_input"
        expect_failure_contains:
          - "R2 is the number of a feature that an earlier version removed"
          - "number a new feature R5 or above"
      - thinking: "R2's number was removed and is never reused, so the restored links are a new feature, R5."
        text: "A removed number is never reused, so the source links come back as R5. I am building them now."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists the latest releases of the organization's repositories, filters them by repository and links them to their sources."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R3, text: "Each release shows its version and publication date."}
                - {id: R4, text: "A visitor filters the list by repository name."}
                - {id: R5, text: "Each release links to its source."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days.", "Typing a repository name narrows the list."]
      - tool_uses:
          - name: write_todos
            input:
              todos:
                - {content: "R5: Link each release to its source", status: in_progress}
      - text: "The revised requirements add R5, and the other features stay as recorded, so the work that follows is only the source links."
