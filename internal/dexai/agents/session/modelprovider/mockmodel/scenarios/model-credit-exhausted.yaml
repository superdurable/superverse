name: model-credit-exhausted
title: "Model provider credit exhausted"
description: "The provider refuses the first call because the account has no credit."
category: platform_error
inputs:
  - label: "Exhaust the provider credit"
    message: "Ask the model with no provider credit."
    replies:
      - error: {status: 400, type: invalid_request_error, message: "Your credit balance is too low to access the Anthropic API. Please go to Plans & Billing to upgrade or purchase credits."}
