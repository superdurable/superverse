# A contribution whose draft pull request cannot be opened. The user confirms a
# card with a new connector, and a connector_develop subagent builds mockretry
# on its library branch, which its finish pushes. The contribution's Flow then
# fails to open the pull request in the upstream library and records
# pull_request_failed; its connector notification opens an automatic turn in
# which the main agent tells the user that the connector's review waits. It
# needs a server whose upstream library refuses the pull request, which only
# the manual GitHub test provides; without an upstream library the
# contribution stays unpublished and no connector notification arrives.
name: connector-pr-retry
title: "Connector development: a pull request that fails"
description: "A connector_develop subagent builds mockretry; opening its draft pull request fails, and the connector notification tells the main agent."
category: platform_error
arguments: {task: agent-aaaaaaaa}
inputs:
  - label: "Describe the application"
    message: "Build a page that lists the newest entries of our retry log."
    replies:
      - text: "No released connector reads the log, so a new one is built upstream. Please confirm what I will build."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Retry log page"
              summary: "A page that lists the newest entries of the retry log."
              features:
                - {id: R1, text: "The page lists the ten newest log entries."}
              connections:
                - need: "Read the newest log entries"
                  connector: mockretry
                  operations: [listEntries]
                  status: new
                  user_setup: "An API key of the log service."
              user_setup: ["Create an API key of the log service."]
              acceptance: ["The page shows the ten newest entries."]
  - label: "Confirm the requirements"
    requirements_confirm: true
    replies:
      - text: "Building the mockretry connector upstream."
        tool_uses:
          - name: start_agent
            input:
              description: "Build the mockretry connector"
              kind: connector_develop
              slug: mockretry
              contribution: new
              prompt: "Build a new connector mockretry with one query operation listEntries. [[subagent:connector-pr-retry/develop]]"
        expect_result_contains:
          - "\"branch\":\"superverse/"
      - text: "A subagent builds the connector; I will tell you when its pull request is open."
      - text: "The mockretry connector is built on its branch; its draft pull request is being opened."
        notification: task
      - text: "The draft pull request of the mockretry connector could not be opened, so its review waits; its branch is kept, and the next change of the connector opens it again."
        notification: connector
subagents:
  develop:
    kind: connector_develop
    replies:
      - text: "Writing the module."
        tool_uses:
          - name: write
            input:
              path: connectors/superverse-mock/mockretry/go.mod
              content: "module github.com/superdurable/dex-connectors-library/connectors/superverse-mock/mockretry\n\ngo 1.25\n"
          - name: write
            input:
              path: connectors/superverse-mock/mockretry/connector.yaml
              content: "apiVersion: connectors.dex.dev/v1alpha1\nkind: Connector\nmetadata:\n  name: mockretry\n  displayName: Mock retry log\n  description: Lists the newest entries of a log.\n  company: Superverse Mock\n  version: v0.21.0\n"
      - text: "Adding the catalog entry."
        tool_uses:
          - name: bash
            input:
              command: "sed -i 's|^directories:$|directories:\\n  - connectors/superverse-mock/mockretry|' catalog.yaml && grep -c 'connectors/superverse-mock/mockretry' catalog.yaml"
              description: "Add the catalog entry of the new connector"
              timeout_seconds: 60
        expect_result_contains:
          - "1"
      - text: "I built the module connectors/superverse-mock/mockretry with its go.mod and manifest and added its catalog.yaml entry. The library's checks did not run in this mock."
