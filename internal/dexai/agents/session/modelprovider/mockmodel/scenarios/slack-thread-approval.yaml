              old_string: |2-
                	server := &http.Server{Addr: ":" + environment("PORT", "8080"), Handler: applicationHandler(apiHandler), ReadHeaderTimeout: 5 * time.Second}
                	workerResult := worker.Start()
                	serverResult := make(chan error, 1)
                	go func() { serverResult <- server.ListenAndServe() }()
                	ctx, stop := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)
                	defer stop()
                	select {
                	case <-ctx.Done():
                	case err := <-workerResult:
                		if err != nil {
                			return fmt.Errorf("run Dex Worker: %w", err)
                		}
              new_string: |2-
                	server := &http.Server{Addr: ":" + environment("PORT", "8080"), Handler: applicationHandler(apiHandler, worker.Triggers), ReadHeaderTimeout: 5 * time.Second}
                	ctx, stop := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)
                	defer stop()
                	workerResult := worker.Start()
                	triggerResult := make(chan error, 1)
                	go func() { triggerResult <- worker.Triggers.Run(ctx) }()
                	serverResult := make(chan error, 1)
                	go func() { serverResult <- server.ListenAndServe() }()
                	select {
                	case <-ctx.Done():
                	case err := <-workerResult:
                		if err != nil {
                			return fmt.Errorf("run Dex Worker: %w", err)
                		}
                	case err := <-triggerResult:
                		if err != nil && ctx.Err() == nil {
                			return fmt.Errorf("run Slack triggers: %w", err)
                		}
