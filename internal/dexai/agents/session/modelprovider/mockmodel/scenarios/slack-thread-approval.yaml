# A product build from the template: a Slack thread approval, as the connectors
# library's thread-approval example. A new top-level message in the configured
# channel starts SlackThreadApprovalFlow (channelThreadCreated, FlowID from the
# team, channel and root timestamp), a reply in its thread invokes the
# ReceiveThreadReply RPC (threadReplyCreated), and the Flow posts
# "Processing complete." into the thread with postThreadReply. The application
# serves the events the platform relays at slack.RelayedTriggerPath of the
# slack-approvals connection (/triggers/slack/c2xhY2stYXBwcm92YWxz) on its HTTP
# server and runs the trigger runner beside the Worker. The text-summary Flow,
# its endpoints, page and tests are replaced, as the template's AGENTS.md says.
# Every write and edit was built and checked outside the scenario (make
# check-static, and the API tests on a real Dex); the edits' old_string is the
# template's own text. Slack v1.0.0 has no mocks, so R3 is traced as untested.
name: slack-thread-approval
title: "Slack thread approval"
description: "Builds a Slack thread approval from the template: a channel message starts a Flow, a thread reply finishes it with Processing complete., and pushes it."
category: product
inputs:
  - label: "Describe the application"
    message: "Build a Slack thread approval: a new message in the channel starts a process, a reply in its thread finishes it with a confirmation."
    replies:
      - thinking: "A new application with a Slack trigger and a reply in the thread; I show the requirements before I write any code, then keep building."
        text: "Here is what I will build. I am starting now; tell me in the chat if anything should change."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Slack thread approval"
              summary: "A process that follows threads in one Slack channel: a new message starts it, and a reply in its thread finishes it with a confirmation posted in the thread."
              features:
                - {id: R1, text: "A new top-level message in the configured Slack channel starts one approval for its thread; a redelivered message starts no second one."}
                - {id: R2, text: "The first matching reply in that thread is accepted and moves the approval on; a later reply changes nothing."}
                - {id: R3, text: "After the reply, the application posts Processing complete. into the same thread and completes the approval."}
              connections:
                - need: "Receive new channel messages and thread replies, and reply in the thread"
                  connector: slack
                  operations: [postThreadReply]
                  status: existing
                  user_setup: "Select the TeamSpace Slack connection as slack-approvals, then choose the channel and the members allowed to reply for both triggers in Studio Configuration."
              user_setup: ["Invite the platform's Slack app to the approval channel."]
              acceptance:
                - "A new message in the channel starts a run in Studio that waits for a reply."
                - "A reply in its thread makes the application post Processing complete. in the thread, and the run completes."
      - thinking: "The template wires one connection and one Flow; I will read its instructions and the files that change."
        text: "Reading the application instructions and the wiring I will change."
        tool_uses:
          - name: read
            input: {path: AGENTS.md}
          - name: read
            input: {path: internal/worker/connections.go}
          - name: read
            input: {path: cmd/server/main.go}
      - text: "Restoring the application's dependencies, as the template's instructions say."
        tool_uses:
          - name: bash
            input: {command: "make bootstrap", description: "Restore the application's dependencies", timeout_seconds: 600}
      - text: "Adding the released Slack connector and the sdkgo release it builds with."
        tool_uses:
          - name: bash
            input: {command: "go get github.com/superdurable/dex-connectors-library/connectors/slack@v1.0.0 github.com/superdurable/dex-connectors-library/sdkgo@v0.28.1", description: "Add the Slack connector and sdkgo", timeout_seconds: 600}
      - thinking: "The connection's authentication method and the relayed trigger path come from the connector release itself."
        text: "Reading the connector's authentication and its relayed trigger path."
        tool_uses:
          - name: bash
            input: {command: "dir=$(go list -m -f '{{.Dir}}' github.com/superdurable/dex-connectors-library/connectors/slack) && sed -n '/^  auth:/,/^    fields:/p' \"$dir/connector.yaml\" && grep -n -A3 '^func RelayedTriggerPath' \"$dir/relayed_trigger.go\"", description: "Read the Slack auth method and relayed trigger path"}
        expect_result_contains: ["slack-socket-mode-oauth", "RelayedTriggerPath"]
      - thinking: "One Flow per file: the root message starts it, the reply RPC moves it to the Slack reply Step, and every failure branch goes to RecordReplyFailure. The trigger runner needs the Dex Client, so the Worker builds it."
        text: "Writing SlackThreadApprovalFlow, its trigger filters, the connection and the trigger runner."
        tool_uses:
          - name: write
            input:
              path: internal/process/slack_thread_approval_flow.go
              content: |2
                package process

                import (
                	"context"
                	"errors"
                	"fmt"

                	"github.com/superdurable/dex-connectors-library/connectors/slack"
                	"github.com/superdurable/dex-connectors-library/sdkgo"
                	"github.com/superdurable/dex/sdk-go/dex"
                )

                // SlackApprovalsConnectionName is the dex-app.yaml connection of the Slack
                // workspace whose channel threads the Flow follows. Studio Configuration owns it.
                const SlackApprovalsConnectionName = "slack-approvals"

                // The dex-app.yaml trigger bindings: a new channel message starts a Flow, and
                // a reply in its thread invokes ReceiveThreadReply.
                const (
                	StartTriggerBinding = "slack-thread-approval-start"
                	ReplyTriggerBinding = "slack-thread-approval-reply"
                )

                // CompletionReplyText is the message the Flow posts into the thread.
                const CompletionReplyText = "Processing complete."

                // postCompletionReplyStep is the Step type of the Slack reply Step.
                const postCompletionReplyStep = "PostCompletionReply"

                // The statuses of one thread approval.
                const (
                	ThreadStatusWaitingForReply = "waiting_for_reply"
                	ThreadStatusPostingReply    = "posting_reply"
                	ThreadStatusCompleted       = "completed"
                	ThreadStatusFailed          = "failed"
                	ThreadStatusUnknown         = "unknown"
                )

                // errThreadNotReady keeps a reply pending until RecordThread has run, so the
                // reply Trigger retries it instead of consuming it.
                var errThreadNotReady = errors.New("the thread approval is still recording its root message")

                // ThreadInput is the Start input: the Slack thread whose root message started
                // the Flow. Studio Start Flow and the start Trigger both send it.
                type ThreadInput struct {
                	EventID         string `json:"eventId"`
                	TeamID          string `json:"teamId"`
                	ChannelID       string `json:"channelId"`
                	ThreadTimestamp string `json:"threadTimestamp"`
                }

                // ThreadReply is the input of ReceiveThreadReply, mapped from a reply event.
                type ThreadReply struct {
                	EventID string `json:"eventId"`
                	UserID  string `json:"userId"`
                }

                // ThreadReplyResult tells the reply Trigger what the reply did.
                type ThreadReplyResult struct {
                	Accepted  bool   `json:"accepted"`
                	Duplicate bool   `json:"duplicate"`
                	Status    string `json:"status"`
                }

                // ThreadApprovalSnapshot is the retained state of one thread approval.
                type ThreadApprovalSnapshot struct {
                	Status      string      `json:"status"`
                	Thread      ThreadInput `json:"thread"`
                	ReplyUserID string      `json:"replyUserId"`
                	Notice      string      `json:"notice"`
                }

                var (
                	// dex:indexed-attribute attribute-key:thread-status index-key:keyword1 index-type:keyword value-type:string description:"Thread approval status"
                	ThreadApprovalStatus       = dex.DefineAttribute[string]("thread-status", dex.Indexed(dex.AttributeIndex{Type: dex.IndexKeyword, IndexKey: "keyword1"}))
                	ThreadApprovalThread       = dex.DefineAttribute[ThreadInput]("thread")
                	ThreadApprovalReplyEventID = dex.DefineAttribute[string]("reply-event-id")
                	ThreadApprovalReplyUserID  = dex.DefineAttribute[string]("reply-user-id")
                	ThreadApprovalNotice       = dex.DefineAttribute[string]("thread-notice")
                )

                // SlackThreadApprovalFlow follows one Slack thread: its root message starts
                // the Flow, the first matching reply posts the completion reply and ends it.
                type SlackThreadApprovalFlow struct {
                	dex.FlowDefaults
                	Connection slack.Connection
                }

                // SlackThreadApprovalFlowID derives the FlowID from the Slack team, channel
                // and root message timestamp, so the root and its replies reach one Flow.
                func SlackThreadApprovalFlowID(teamID, channelID, threadTimestamp string) string {
                	return fmt.Sprintf("slack-thread-approval-%s-%s-%s", teamID, channelID, threadTimestamp)
                }

                // ReadThreadApproval reads the retained snapshot; found is false for an
                // unknown FlowID.
                func ReadThreadApproval(ctx context.Context, client *dex.Client, flowID string) (snapshot ThreadApprovalSnapshot, found bool, err error) {
                	err = client.InvokeRPC(ctx, flowID, SlackThreadApprovalFlow{}.GetThreadApproval, nil, &snapshot)
                	// A read-only RPC is also served by a completed Flow, so this error means the
                	// Flow never started.
                	var missing *dex.FlowNotActiveOrNotFoundError
                	if errors.As(err, &missing) {
                		return ThreadApprovalSnapshot{}, false, nil
                	}
                	return snapshot, err == nil, err
                }

                func (flow SlackThreadApprovalFlow) GetSteps() []dex.StepDef {
                	return []dex.StepDef{
                		dex.DefineStartStep(RecordThread{}),
                		dex.DefineStep(slack.NewPostThreadReplyStep(slack.PostThreadReplyStepConfig[ThreadInput]{
                			StepType:       postCompletionReplyStep,
                			Connection:     flow.Connection,
                			ConnectionName: SlackApprovalsConnectionName,
                			Annotations:    sdkgo.StepAnnotations{GroupID: "reply", GroupLabel: "Reply", Explanation: "Post Processing complete. into the thread once a matching reply arrived."},
                			MapToOperationInput: func(thread ThreadInput) slack.PostThreadReplyInput {
                				return slack.PostThreadReplyInput{ChannelID: thread.ChannelID, ThreadTimestamp: thread.ThreadTimestamp, Text: CompletionReplyText}
                			},
                			// Failure branches never look like success: RecordReplyFailure switches on the branch.
                			Sent:             sdkgo.GoTo(CompleteThread{}),
                			ProviderRejected: sdkgo.GoTo(RecordReplyFailure{}), Defect: sdkgo.GoTo(RecordReplyFailure{}),
                			Uncertain: sdkgo.GoTo(RecordReplyFailure{}),
                		})),
                		dex.DefineStep(CompleteThread{}),
                		dex.DefineStep(RecordReplyFailure{}),
                	}
                }

                func (flow SlackThreadApprovalFlow) GetRPCs() []dex.RPCDef {
                	return []dex.RPCDef{
                		dex.DefineRPC(flow.ReceiveThreadReply, &dex.RPCOptions{LockAttributes: []dex.AttributeLock{
                			dex.LockAttribute(ThreadApprovalStatus), dex.LockAttribute(ThreadApprovalReplyEventID),
                		}}),
                		dex.DefineRPC(flow.GetDexSummary, nil),
                		dex.DefineRPC(flow.GetDexDisplay, nil),
                		dex.DefineRPC(flow.GetThreadApproval, nil),
                	}
                }

                func (SlackThreadApprovalFlow) GetPersistenceSchema() dex.PersistenceSchema {
                	return dex.PersistenceSchema{Attributes: []dex.AttributeDef{
                		ThreadApprovalStatus, ThreadApprovalThread, ThreadApprovalReplyEventID, ThreadApprovalReplyUserID, ThreadApprovalNotice,
                	}}
                }

                // GetConnectorTriggerBindings declares the two Slack Triggers; Studio
                // Configuration saves each binding's channel and matchers.
                func (SlackThreadApprovalFlow) GetConnectorTriggerBindings() []sdkgo.TriggerBindingDefinition {
                	return []sdkgo.TriggerBindingDefinition{
                		slack.DefineChannelThreadCreatedTriggerBinding(slack.ChannelThreadCreatedTriggerBindingConfig{
                			ConnectionName: SlackApprovalsConnectionName, BindingName: StartTriggerBinding,
                			ConfigurationUI: sdkgo.ConnectorConfigurationUI{Units: []sdkgo.ConnectorUIUnit{
                				{
                					ID: "channel", UnitID: slack.UIUnitChannelPicker, Label: "Approval channel", Required: true,
                					Description: "Select the joined Slack channel whose new messages start a thread approval.",
                					Bindings:    []sdkgo.ConnectorUIBinding{{Port: slack.UIChannelPickerPortChannelID, JSONPointer: "/channelId"}},
                				},
                				{
                					ID: "message", UnitID: slack.UIUnitTextInput, Label: "Start message contains",
                					Description: "Enter text the new message must contain; leave blank to match any message.",
                					Bindings:    []sdkgo.ConnectorUIBinding{{Port: slack.UITextInputPortText, JSONPointer: "/threadTriggerMatcher/messageContains"}},
                				},
                			}},
                		}),
                		slack.DefineThreadReplyCreatedTriggerBinding(slack.ThreadReplyCreatedTriggerBindingConfig{
                			ConnectionName: SlackApprovalsConnectionName, BindingName: ReplyTriggerBinding,
                			ConfigurationUI: sdkgo.ConnectorConfigurationUI{Units: []sdkgo.ConnectorUIUnit{
                				{
                					ID: "channel", UnitID: slack.UIUnitChannelPicker, Label: "Approval channel", Required: true,
                					Description: "Select the same channel as the start Trigger.",
                					Bindings:    []sdkgo.ConnectorUIBinding{{Port: slack.UIChannelPickerPortChannelID, JSONPointer: "/channelId"}},
                				},
                				{
                					ID: "message", UnitID: slack.UIUnitTextInput, Label: "Reply contains",
                					Description: "Enter text a reply must contain, such as approve; leave blank to match any reply.",
                					Bindings:    []sdkgo.ConnectorUIBinding{{Port: slack.UITextInputPortText, JSONPointer: "/threadReplyMatcher/messageContains"}},
                				},
                				{
                					ID: "approvers", UnitID: slack.UIUnitMemberPicker, Label: "Members allowed to reply", Required: true,
                					Description: "Select the members whose thread replies finish the approval.",
                					Bindings:    []sdkgo.ConnectorUIBinding{{Port: slack.UIMemberPickerPortMemberIDs, JSONPointer: "/threadReplyMatcher/posterUserIds"}},
                				},
                			}},
                		}),
                	}
                }

                // dex:group group-id:thread group-label:"Thread"
                // dex:explanation text:"Keep the Slack thread that the new channel message started and wait for a reply in it."
                type RecordThread struct {
                	dex.StepDefaultsNoWaitFor[ThreadInput]
                }

                func (RecordThread) GetStepOptions() *dex.StepOptions {
                	return &dex.StepOptions{ExecuteLockAttributes: []dex.AttributeLock{dex.LockAttribute(ThreadApprovalStatus)}}
                }

                func (RecordThread) Execute(ctx dex.Context, thread ThreadInput) (_ *dex.StepDecision, err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "RecordThread", &err)
                	if err = errors.Join(ThreadApprovalThread.Set(ctx, thread), ThreadApprovalStatus.Set(ctx, ThreadStatusWaitingForReply)); err != nil {
                		return nil, err
                	}
                	return dex.DeadEnd(), nil
                }

                // dex:group group-id:reply group-label:"Reply"
                // dex:explanation text:"Complete once Slack confirms the completion reply."
                type CompleteThread struct {
                	dex.StepDefaultsNoWaitFor[slack.PostThreadReplyResult]
                }

                func (CompleteThread) GetStepOptions() *dex.StepOptions {
                	return &dex.StepOptions{ExecuteLockAttributes: []dex.AttributeLock{dex.LockAttribute(ThreadApprovalStatus)}}
                }

                func (CompleteThread) Execute(ctx dex.Context, _ slack.PostThreadReplyResult) (_ *dex.StepDecision, err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "CompleteThread", &err)
                	if err = ThreadApprovalStatus.Set(ctx, ThreadStatusCompleted); err != nil {
                		return nil, err
                	}
                	return dex.GracefulComplete(nil), nil
                }

                // dex:group group-id:reply group-label:"Reply"
                // dex:explanation text:"Record why the completion reply was not confirmed, without posting it again."
                type RecordReplyFailure struct {
                	dex.StepDefaultsNoWaitFor[slack.PostThreadReplyResult]
                }

                func (RecordReplyFailure) GetStepOptions() *dex.StepOptions {
                	return &dex.StepOptions{ExecuteLockAttributes: []dex.AttributeLock{dex.LockAttribute(ThreadApprovalStatus)}}
                }

                // Execute receives the rejected, defect and uncertain branches.
                func (RecordReplyFailure) Execute(ctx dex.Context, result slack.PostThreadReplyResult) (_ *dex.StepDecision, err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "RecordReplyFailure", &err)
                	status, notice := ThreadStatusFailed, "Slack did not accept the completion reply. Check the slack-approvals connection in Studio Configuration."
                	if result.Branch == slack.PostThreadReplyBranchUncertain {
                		status, notice = ThreadStatusUnknown, "Slack did not confirm the completion reply; it may have been posted. Check the thread."
                	}
                	if err = errors.Join(ThreadApprovalStatus.Set(ctx, status), ThreadApprovalNotice.Set(ctx, notice)); err != nil {
                		return nil, err
                	}
                	return dex.GracefulComplete(nil), nil
                }

                // ReceiveThreadReply accepts the first matching reply while the Flow waits and
                // moves it to the completion reply. It rechecks the status under its lock, so
                // a redelivered or later reply posts nothing again.
                func (SlackThreadApprovalFlow) ReceiveThreadReply(ctx dex.Context, reply ThreadReply) (_ *dex.RPCResult[ThreadReplyResult], err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "ReceiveThreadReply", &err)
                	status, err := optional(ctx, ThreadApprovalStatus)
                	if err != nil {
                		return nil, err
                	}
                	acceptedEventID, err := optional(ctx, ThreadApprovalReplyEventID)
                	if err != nil {
                		return nil, err
                	}
                	switch {
                	case acceptedEventID != "" && acceptedEventID == reply.EventID:
                		return &dex.RPCResult[ThreadReplyResult]{Output: ThreadReplyResult{Duplicate: true, Status: status}}, nil
                	case status == "":
                		return nil, errThreadNotReady
                	case status != ThreadStatusWaitingForReply:
                		return &dex.RPCResult[ThreadReplyResult]{Output: ThreadReplyResult{Status: status}}, nil
                	}
                	thread, err := ThreadApprovalThread.Get(ctx)
                	if err != nil {
                		return nil, err
                	}
                	err = errors.Join(
                		ThreadApprovalStatus.Set(ctx, ThreadStatusPostingReply),
                		ThreadApprovalReplyEventID.Set(ctx, reply.EventID),
                		ThreadApprovalReplyUserID.Set(ctx, reply.UserID),
                	)
                	if err != nil {
                		return nil, err
                	}
                	return &dex.RPCResult[ThreadReplyResult]{
                		Output:    ThreadReplyResult{Accepted: true, Status: ThreadStatusPostingReply},
                		NextSteps: []dex.StepMovement{dex.MovementOf(sdkgo.StepRef[ThreadInput](postCompletionReplyStep), thread)},
                	}, nil
                }

                // dex:field attribute-key:reply-user-id value-type:string editable:false description:"Replied by"
                // dex:field attribute-key:thread-notice value-type:string editable:false description:"Notice"
                func (SlackThreadApprovalFlow) GetDexSummary(ctx dex.Context, _ dex.None) (_ *dex.RPCResult[map[string]any], err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "GetDexSummary", &err)
                	snapshot, err := readThreadApproval(ctx)
                	if err != nil {
                		return nil, err
                	}
                	return &dex.RPCResult[map[string]any]{Output: map[string]any{
                		"reply-user-id": snapshot.ReplyUserID, "thread-notice": snapshot.Notice,
                	}}, nil
                }

                // dex:field attribute-key:thread-status value-type:string editable:false ui-slot:status description:"Status"
                // dex:field attribute-key:thread value-type:json editable:false description:"Slack thread"
                // dex:field attribute-key:reply-user-id value-type:string editable:false description:"Replied by"
                // dex:field attribute-key:thread-notice value-type:string editable:false ui-slot:reason description:"Notice"
                func (SlackThreadApprovalFlow) GetDexDisplay(ctx dex.Context, _ dex.None) (_ *dex.RPCResult[map[string]any], err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "GetDexDisplay", &err)
                	snapshot, err := readThreadApproval(ctx)
                	if err != nil {
                		return nil, err
                	}
                	return &dex.RPCResult[map[string]any]{Output: map[string]any{
                		"thread-status": snapshot.Status, "thread": snapshot.Thread,
                		"reply-user-id": snapshot.ReplyUserID, "thread-notice": snapshot.Notice,
                	}}, nil
                }

                // GetThreadApproval is read-only, so it also serves a completed Flow.
                func (SlackThreadApprovalFlow) GetThreadApproval(ctx dex.Context, _ dex.None) (_ *dex.RPCResult[ThreadApprovalSnapshot], err error) {
                	defer logFailure(ctx, SlackThreadApprovalFlow{}, "GetThreadApproval", &err)
                	snapshot, err := readThreadApproval(ctx)
                	if err != nil {
                		return nil, err
                	}
                	return &dex.RPCResult[ThreadApprovalSnapshot]{Output: snapshot}, nil
                }

                // readThreadApproval reads every Attribute; status is "pending" until RecordThread runs.
                func readThreadApproval(ctx dex.Context) (snapshot ThreadApprovalSnapshot, err error) {
                	var errs [4]error
                	snapshot.Status, errs[0] = optional(ctx, ThreadApprovalStatus)
                	snapshot.Thread, errs[1] = optional(ctx, ThreadApprovalThread)
                	snapshot.ReplyUserID, errs[2] = optional(ctx, ThreadApprovalReplyUserID)
                	snapshot.Notice, errs[3] = optional(ctx, ThreadApprovalNotice)
                	if snapshot.Status == "" {
                		snapshot.Status = "pending"
                	}
                	return snapshot, errors.Join(errs[:]...)
                }

                // optional returns the zero value for an Attribute the Flow has not written yet.
                func optional[T any](ctx dex.Context, attribute dex.Attribute[T]) (T, error) {
                	value, err := attribute.Get(ctx)
                	var missing *dex.AttributeNotFoundError
                	if errors.As(err, &missing) {
                		return value, nil
                	}
                	return value, err
                }
          - name: write
            input:
              path: internal/process/slack_thread_triggers.go
              content: |2
                package process

                import (
                	"slices"
                	"strings"

                	"github.com/superdurable/dex-connectors-library/connectors/slack"
                	"github.com/superdurable/dex-connectors-library/sdkgo"
                )

                // NewStartTriggerFilter admits a top-level message of the configured channel
                // that matches the start binding's matcher.
                func NewStartTriggerFilter(configuration slack.ChannelThreadCreatedTriggerConfiguration) (sdkgo.TriggerFilter[slack.MessageEvent], error) {
                	if err := configuration.Validate(); err != nil {
                		return nil, err
                	}
                	return messageFilter(configuration.ChannelID, configuration.ThreadTriggerMatcher, false), nil
                }

                // NewReplyTriggerFilter admits a thread reply of the configured channel that
                // matches the reply binding's matcher.
                func NewReplyTriggerFilter(configuration slack.ThreadReplyCreatedTriggerConfiguration) (sdkgo.TriggerFilter[slack.MessageEvent], error) {
                	if err := configuration.Validate(); err != nil {
                		return nil, err
                	}
                	return messageFilter(configuration.ChannelID, configuration.ThreadReplyMatcher, true), nil
                }

                // ResolveThreadApprovalFlowID gives a root message and its replies one FlowID.
                func ResolveThreadApprovalFlowID(event sdkgo.TriggerEvent[slack.MessageEvent]) string {
                	message := event.Payload
                	return SlackThreadApprovalFlowID(message.TeamID, message.ChannelID, message.ThreadTimestamp)
                }

                // MapToThreadInput is the Start input of a root message.
                func MapToThreadInput(event sdkgo.TriggerEvent[slack.MessageEvent]) ThreadInput {
                	message := event.Payload
                	return ThreadInput{EventID: event.ID, TeamID: message.TeamID, ChannelID: message.ChannelID, ThreadTimestamp: message.ThreadTimestamp}
                }

                // MapToThreadReply is the ReceiveThreadReply input of a reply: its event and
                // author only, never the message text.
                func MapToThreadReply(event sdkgo.TriggerEvent[slack.MessageEvent]) ThreadReply {
                	return ThreadReply{EventID: event.ID, UserID: event.Payload.UserID}
                }

                func messageFilter(channelID string, matcher slack.MessageMatcher, reply bool) sdkgo.TriggerFilter[slack.MessageEvent] {
                	return func(event sdkgo.TriggerEvent[slack.MessageEvent]) bool {
                		message := event.Payload
                		isReply := message.ThreadTimestamp != "" && message.ThreadTimestamp != message.Timestamp
                		if event.ID == "" || message.TeamID == "" || message.ChannelID != channelID || message.ThreadTimestamp == "" || message.UserID == "" || isReply != reply {
                			return false
                		}
                		if matcher.MessageContains != "" && !strings.Contains(strings.ToLower(message.Text), strings.ToLower(matcher.MessageContains)) {
                			return false
                		}
                		return len(matcher.PosterUserIDs) == 0 || slices.Contains(matcher.PosterUserIDs, message.UserID)
                	}
                }
          - name: write
            input:
              path: internal/worker/connections.go
              content: |2
                package worker

                import (
                	"fmt"

                	"github.com/superdurable/dex-connectors-library/connectors/slack"
                	"github.com/superdurable/dex-template-basic-process/internal/connectorconfiguration"
                	"github.com/superdurable/dex-template-basic-process/internal/process"
                )

                // Connections holds one opened connection per dex-app.yaml connection. The
                // Worker opens them from the project configuration; API tests pass
                // connections without credentials instead.
                type Connections struct {
                	// SlackApprovals is the slack-approvals connection of SlackThreadApprovalFlow.
                	SlackApprovals slack.Connection
                }

                // OpenConnections opens every declared connection with its connector's
                // generated NewProjectConnection. Add one field and one line per connection.
                func OpenConnections(configuration connectorconfiguration.Configuration) (Connections, error) {
                	slackApprovals, err := slack.NewProjectConnection(configuration.Project(), process.SlackApprovalsConnectionName)
                	if err != nil {
                		return Connections{}, fmt.Errorf("configure %s connection: %w", process.SlackApprovalsConnectionName, err)
                	}
                	return Connections{SlackApprovals: slackApprovals}, nil
                }
          - name: write
            input:
              path: internal/worker/application.go
              content: |2
                package worker

                import (
                	"github.com/superdurable/dex-template-basic-process/internal/process"
                	"github.com/superdurable/dex/sdk-go/dex"
                )

                // Application is the single list of the application's Flows with their
                // connections: the Worker and the API tests register exactly this list. List
                // every Flow here and its source file in dex-app.yaml.
                func Application(connections Connections) []dex.Flow {
                	return []dex.Flow{
                		process.SlackThreadApprovalFlow{Connection: connections.SlackApprovals},
                	}
                }
          - name: write
            input:
              path: internal/worker/triggers.go
              content: |2
                package worker

                import (
                	"fmt"
                	"log/slog"

                	"github.com/superdurable/dex-connectors-library/connectors/slack"
                	"github.com/superdurable/dex-connectors-library/sdkgo"
                	"github.com/superdurable/dex-template-basic-process/internal/connectorconfiguration"
                	"github.com/superdurable/dex-template-basic-process/internal/process"
                	"github.com/superdurable/dex/sdk-go/dex"
                )

                // OpenTriggers builds the Slack Trigger runner of the slack-approvals
                // connection from the bindings saved in Studio Configuration: a new channel
                // message starts SlackThreadApprovalFlow, a reply in its thread invokes
                // ReceiveThreadReply. The runner serves the events the platform relays at
                // slack.RelayedTriggerPath and runs until its context ends.
                func OpenTriggers(configuration connectorconfiguration.Configuration, connections Connections, client *dex.Client, logger *slog.Logger) (*slack.MessageTriggerRunner, error) {
                	project := configuration.Project()
                	var start slack.ChannelThreadCreatedTriggerConfiguration
                	if err := project.Configuration.DecodeTriggerConfiguration(slack.ConnectorID, process.SlackApprovalsConnectionName,
                		slack.ChannelThreadCreatedTriggerDefinition.Trigger.TriggerName, process.StartTriggerBinding, &start); err != nil {
                		return nil, fmt.Errorf("read the %s trigger binding: %w", process.StartTriggerBinding, err)
                	}
                	startFilter, err := process.NewStartTriggerFilter(start)
                	if err != nil {
                		return nil, fmt.Errorf("configure the %s trigger binding: %w", process.StartTriggerBinding, err)
                	}
                	var reply slack.ThreadReplyCreatedTriggerConfiguration
                	if err := project.Configuration.DecodeTriggerConfiguration(slack.ConnectorID, process.SlackApprovalsConnectionName,
                		slack.ThreadReplyCreatedTriggerDefinition.Trigger.TriggerName, process.ReplyTriggerBinding, &reply); err != nil {
                		return nil, fmt.Errorf("read the %s trigger binding: %w", process.ReplyTriggerBinding, err)
                	}
                	replyFilter, err := process.NewReplyTriggerFilter(reply)
                	if err != nil {
                		return nil, fmt.Errorf("configure the %s trigger binding: %w", process.ReplyTriggerBinding, err)
                	}
                	flow := process.SlackThreadApprovalFlow{Connection: connections.SlackApprovals}
                	runner, err := slack.NewProjectMessageTriggerRunner(project, process.SlackApprovalsConnectionName, slack.ProjectMessageTriggerRunnerConfig{
                		ChannelThreadCreatedRoutes: []slack.ProjectChannelThreadCreatedTriggerRoute{
                			{
                				BindingName: process.StartTriggerBinding,
                				Target:      sdkgo.NewDexFlowTriggerTarget(client, flow, startFilter, process.ResolveThreadApprovalFlowID, process.MapToThreadInput),
                			},
                		},
                		ThreadReplyCreatedRoutes: []slack.ProjectThreadReplyCreatedTriggerRoute{
                			{
                				BindingName: process.ReplyTriggerBinding,
                				Target:      sdkgo.NewDexRPCTriggerTarget(client, flow.ReceiveThreadReply, replyFilter, process.ResolveThreadApprovalFlowID, process.MapToThreadReply),
                			},
                		},
                	}, slack.WithLogger(logger))
                	if err != nil {
                		return nil, fmt.Errorf("create the %s trigger runner: %w", process.SlackApprovalsConnectionName, err)
                	}
                	return runner, nil
                }
