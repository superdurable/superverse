# The user changes the requirements while the Agent works (input 2). The first card is
# recorded as version 1 and the turn goes on: the Agent waits on a durable timer, which a
# steered message interrupts. The change revises the card with a third feature, keeping
# R1 and R2, recorded as version 2. A message sent after the turn ended starts the same
# revision in the next turn. The script touches no workspace file, so a Session can run it
# on any READY Project.
name: requirements-draft-changes
title: "Requirements changed by a message"
description: "A card recorded as version 1 while the Agent goes on, then a message that adds a third feature: the revised card is version 2, followed by a progress list."
category: project_feature
inputs:
  - label: "Describe the application"
    message: "Plan a release tracker."
    replies:
      - thinking: "A new application, so I show the requirements before I write any code, then keep building."
        text: "Here is what I will build. I am starting now; tell me in the chat if anything should change."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists the latest releases of the organization's repositories."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R2, text: "Each release links to its source."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days."]
      - text: "Preparing the release list; a message from you now revises the requirements first."
        tool_uses:
          - name: start_timer
            input: {duration_seconds: 900, reason: "Prepare the release list."}
        expect_failure: true
        expect_failure_text: "Error: superseded_by_steered_user_message"
      - text: "Nothing changed, so I build version 1."
  - label: "Change the requirements"
    message: "Let visitors filter the list by repository name."
    replies:
      - text: "I added the change you asked for as the next version."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists and searches the latest releases of the organization's repositories."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R2, text: "Each release links to its source."}
                - {id: R3, text: "A visitor filters the list by repository name."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days.", "Typing a repository name narrows the list."]
      - tool_uses:
          - name: write_todos
            input:
              todos:
                - {content: "Build the release list", status: in_progress}
                - {content: "Add the repository filter", status: pending}
      - text: "The revised requirements are recorded as version 2, and I will build exactly these features."
