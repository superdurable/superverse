# The user asks for changes to the draft card (input 2), before anything is
# confirmed: the Agent revises it with a third feature, keeping R1 and R2, and
# shows it again; the confirmation of the revised card (input 3) is the first
# version. Nothing is confirmed until then. The script touches no workspace
# file, so a Session can run it on any READY Project.
name: requirements-draft-changes
title: "Requirements draft changed"
description: "A card, a revised card with a third feature after a request for changes to the draft, then a progress list after the confirmation."
category: project_feature
inputs:
  - label: "Describe the application"
    message: "Plan a release tracker."
    replies:
      - thinking: "A new application, so the user confirms the requirements before I write any code."
        text: "Here is what I plan to build. Please confirm it, or tell me what to change."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists the latest releases of the organization's repositories."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R2, text: "Each release links to its source."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days."]
  - label: "Ask for changes to the draft"
    requirements_change: "Let visitors filter the list by repository name."
    replies:
      - text: "I added the change you asked for. Please confirm the revised requirements."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "Release tracker"
              summary: "A page that lists and searches the latest releases of the organization's repositories."
              features:
                - {id: R1, text: "The page lists the releases of the last seven days, newest first."}
                - {id: R2, text: "Each release links to its source."}
                - {id: R3, text: "A visitor filters the list by repository name."}
              connections: []
              user_setup: []
              acceptance: ["The page shows the releases of the last seven days.", "Typing a repository name narrows the list."]
  - label: "Confirm the revised requirements"
    requirements_confirm: true
    replies:
      - tool_uses:
          - name: write_todos
            input:
              todos:
                - {content: "Build the release list", status: in_progress}
                - {content: "Add the repository filter", status: pending}
      - text: "The revised requirements are confirmed, and I will build exactly these features."
