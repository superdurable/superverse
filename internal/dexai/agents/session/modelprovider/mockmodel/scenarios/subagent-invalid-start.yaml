# Every invalid start is answered before admission; no subagent script is needed.
name: subagent-invalid-start
title: "Invalid subagent starts"
description: "An over-long description, invalid connector slug and over-long prompt are refused before any subagent starts."
category: agent_error
inputs:
  - label: "Delegate with invalid inputs"
    message: "Try delegating with invalid descriptions, connector IDs and prompts."
    replies:
      - text: "Trying a start with an invalid description."
        invalid_tool_arguments: true
        expect_failure: true
        expect_failure_text: "Error: invalid_arguments"
        tool_uses:
          - name: start_agent
            input: {"description": "ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd", "kind": "investigate", "prompt": "Find every application heading."}
      - text: "Trying a start with an invalid slug."
        invalid_tool_arguments: true
        expect_failure: true
        expect_failure_text: "Error: invalid_arguments"
        tool_uses:
          - name: start_agent
            input: {"description": "Build the NewsAPI connector", "kind": "connector_develop", "slug": "NewsAPI", "contribution": "new", "prompt": "Build a connector that lists articles."}
      - text: "Trying a start with an invalid prompt."
        invalid_tool_arguments: true
        expect_failure: true
        expect_failure_text: "Error: invalid_arguments"
        tool_uses:
          - name: start_agent
            input: {"description": "Find the headings", "kind": "investigate", "prompt": ""}
      - text: "All three starts were refused as invalid_arguments. No subagent started."
