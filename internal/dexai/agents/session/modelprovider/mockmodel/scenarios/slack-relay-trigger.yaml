# A Slack-triggered Flow on a platform Slack connection, which the platform's
# Slack event relay feeds. The script writes SlackMessageFlow, a Slack message
# trigger runner on the connection "support" whose channelThreadCreated binding
# "support-message" starts it, mounts the runner at the relayed trigger path of
# the application's HTTP server, declares the connection with Slack v1.0.0 in
# dex-app.yaml and fetches the connector. The Flow has no API test, because a
# relayed trigger has no connector mock, so the script pushes a blocked
# checkpoint, which skips the source gate; the Session continues the turn three
# times. A test deploys the commit itself, configures the connection and drives
# the relay (TestSlackRelayDexIntegration).
name: slack-relay-trigger
title: "Start a Flow from relayed Slack messages"
description: "Adds a Flow that a Slack message trigger on a platform Slack connection starts, mounted at the relayed trigger path, and pushes it as a checkpoint."
category: project_feature
inputs:
  - label: "Add the Slack trigger"
    message: "Start a run for every new message in our support Slack channel."
    replies:
      - text: "Restoring the application's dependencies and generating its API code, as the template's instructions say."
        tool_uses:
          - name: bash
            input: {command: "make bootstrap && make generate", description: "Restore the dependencies and generate the API code", timeout_seconds: 600}
      - text: "Writing internal/process/slack_message_flow.go."
        tool_uses:
          - name: write
            input:
              path: internal/process/slack_message_flow.go
              content: |
                package process

                import (
                	"errors"

                	"github.com/superdurable/dex-connectors-library/connectors/slack"
                	"github.com/superdurable/dex-connectors-library/sdkgo"
                	"github.com/superdurable/dex/sdk-go/dex"
                )

                // SlackConnectionName is the dex-app.yaml Slack connection whose
                // channelThreadCreated binding SlackMessageBinding starts SlackMessageFlow.
                const (
                	SlackConnectionName = "support"
                	SlackMessageBinding = "support-message"
                )

                // SlackMessageInput is the Slack message that started the Flow.
                type SlackMessageInput struct {
                	ChannelID string `json:"channelId"`
                	Text      string `json:"text"`
                }

                var (
                	SlackMessageChannel = dex.DefineAttribute[string]("slack-channel")
                	SlackMessageText    = dex.DefineAttribute[string]("slack-text")
                )

                // SlackMessageFlow records one top-level Slack message of the configured
                // channel.
                type SlackMessageFlow struct {
                	dex.FlowDefaults
                }

                // SlackMessageFlowID is one Flow per Slack event, so a repeated event starts
                // no second Flow.
                func SlackMessageFlowID(event sdkgo.TriggerEvent[slack.MessageEvent]) string {
                	return "slack-message-" + event.ID
                }

                // SlackMessageFlowInput maps the Slack message to the Flow's input.
                func SlackMessageFlowInput(event sdkgo.TriggerEvent[slack.MessageEvent]) SlackMessageInput {
                	return SlackMessageInput{ChannelID: event.Payload.ChannelID, Text: event.Payload.Text}
                }

                func (SlackMessageFlow) GetSteps() []dex.StepDef {
                	return []dex.StepDef{dex.DefineStartStep(RecordSlackMessage{})}
                }

                // GetConnectorTriggerBindings declares the support connection's channel
                // binding, which Studio configures with the channel to watch.
                func (SlackMessageFlow) GetConnectorTriggerBindings() []sdkgo.TriggerBindingDefinition {
                	return []sdkgo.TriggerBindingDefinition{
                		slack.DefineChannelThreadCreatedTriggerBinding(slack.ChannelThreadCreatedTriggerBindingConfig{
                			ConnectionName: SlackConnectionName, BindingName: SlackMessageBinding,
                			ConfigurationUI: sdkgo.ConnectorConfigurationUI{Units: []sdkgo.ConnectorUIUnit{{
                				ID: "channel", UnitID: slack.UIUnitChannelPicker, Label: "Channel", Description: "Select the joined Slack channel whose new messages start a run.",
                				Required: true, Bindings: []sdkgo.ConnectorUIBinding{{Port: slack.UIChannelPickerPortChannelID, JSONPointer: "/channelId"}},
                			}}},
                		}),
                	}
                }

                func (flow SlackMessageFlow) GetRPCs() []dex.RPCDef {
                	return []dex.RPCDef{dex.DefineRPC(flow.GetDexSummary, nil), dex.DefineRPC(flow.GetDexDisplay, nil)}
                }

                func (SlackMessageFlow) GetPersistenceSchema() dex.PersistenceSchema {
                	return dex.PersistenceSchema{Attributes: []dex.AttributeDef{SlackMessageChannel, SlackMessageText}}
                }

                // dex:group group-id:slack group-label:"Slack"
                // dex:explanation text:"Record the Slack message that started the run."
                type RecordSlackMessage struct {
                	dex.StepDefaultsNoWaitFor[SlackMessageInput]
                }

                func (RecordSlackMessage) Execute(ctx dex.Context, input SlackMessageInput) (*dex.StepDecision, error) {
                	if err := errors.Join(SlackMessageChannel.Set(ctx, input.ChannelID), SlackMessageText.Set(ctx, input.Text)); err != nil {
                		return nil, err
                	}
                	return dex.GracefulComplete(nil), nil
                }

                // dex:field attribute-key:slack-channel value-type:string editable:false description:"Channel"
                func (SlackMessageFlow) GetDexSummary(ctx dex.Context, _ dex.None) (*dex.RPCResult[map[string]any], error) {
                	channel, err := optional(ctx, SlackMessageChannel)
                	if err != nil {
                		return nil, err
                	}
                	return &dex.RPCResult[map[string]any]{Output: map[string]any{"slack-channel": channel}}, nil
                }

                // dex:field attribute-key:slack-channel value-type:string editable:false description:"Channel"
                // dex:field attribute-key:slack-text value-type:string editable:false description:"Message"
                func (SlackMessageFlow) GetDexDisplay(ctx dex.Context, _ dex.None) (*dex.RPCResult[map[string]any], error) {
                	channel, err := optional(ctx, SlackMessageChannel)
                	if err != nil {
                		return nil, err
                	}
                	text, err := optional(ctx, SlackMessageText)
                	if err != nil {
                		return nil, err
                	}
                	return &dex.RPCResult[map[string]any]{Output: map[string]any{"slack-channel": channel, "slack-text": text}}, nil
                }

      - text: "Writing internal/worker/slack_trigger.go."
        tool_uses:
          - name: write
            input:
              path: internal/worker/slack_trigger.go
              content: |
                package worker

                import (
                	"log/slog"

                	"github.com/superdurable/dex-connectors-library/connectors/slack"
                	"github.com/superdurable/dex-connectors-library/sdkgo"
                	"github.com/superdurable/dex-connectors-library/sdkgo/projectconfig"
                	"github.com/superdurable/dex-template-basic-process/internal/process"
                	"github.com/superdurable/dex/sdk-go/dex"
                )

                // newSlackTrigger starts SlackMessageFlow for every top-level message that the
                // support connection's binding accepts. Without an app_token the host relays
                // the events to slack.RelayedTriggerPath, where main mounts the runner.
                func newSlackTrigger(project *projectconfig.LoadedProject, client *dex.Client, logger *slog.Logger) (*slack.MessageTriggerRunner, error) {
                	everyMessage := func(sdkgo.TriggerEvent[slack.MessageEvent]) bool { return true }
                	return slack.NewProjectMessageTriggerRunner(project, process.SlackConnectionName, slack.ProjectMessageTriggerRunnerConfig{
                		ChannelThreadCreatedRoutes: []slack.ProjectChannelThreadCreatedTriggerRoute{{
                			BindingName: process.SlackMessageBinding,
                			Target:      sdkgo.NewDexFlowTriggerTarget(client, process.SlackMessageFlow{}, everyMessage, process.SlackMessageFlowID, process.SlackMessageFlowInput),
                		}},
                	}, slack.WithLogger(logger))
                }
      - text: "Writing internal/worker/worker.go."
        tool_uses:
          - name: write
            input:
              path: internal/worker/worker.go
              content: "package worker\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"log/slog\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"time\"\n\n\t\"github.com/superdurable/dex-connectors-library/connectors/slack\"\n\t\"github.com/superdurable/dex-template-basic-process/internal/connectorconfiguration\"\n\t\"github.com/superdurable/dex/blob-cache-go/blobcache\"\n\t\"github.com/superdurable/dex/sdk-go/dex\"\n)\n\n// Worker owns the Dex Worker, the Dex Client used by the API, and their blob cache.\ntype Worker struct {\n lifecycle *lifecycle\n cancel context.CancelFunc\n\tClient *dex.Client\n\t// SlackTrigger receives the relayed Slack events of the support connection.\n\tSlackTrigger *slack.MessageTriggerRunner\n\tdexWorker    *dex.Worker\n\tcache        *blobcache.Cache\n}\n\nfunc New(logger *slog.Logger) (*Worker, error) {\n lifecycle, err := loadRuntime()\n if err != nil { return nil, err }\n\tctx, cancel := context.WithTimeout(context.Background(), 60*time.Second)\n\tdefer cancel()\n\tconfiguration, err := connectorconfiguration.Load(ctx)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"load connector configuration: %w\", err)\n\t}\n\tconnections, err := OpenConnections(configuration)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tregistry, err := dex.NewRegistry(Application(connections))\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"register Flows: %w\", err)\n\t}\n\tcache, err := blobcache.New(&blobcache.Config{Dir: filepath.Join(environment(\"DEX_BLOB_CACHE_DIR\", filepath.Join(os.TempDir(), \"application-blobs\")), string(lifecycle.mode)), MaxBytes: 256 << 20, Logger: logger})\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"create Dex blob cache: %w\", err)\n\t}\n\tflowServiceAddress := environment(\"DEX_FLOW_SERVICE_ADDRESS\", \"127.0.0.1:8801\")\n options := lifecycle.options(flowServiceAddress)\n options.Logger = logger\n dexWorker, err := dex.NewWorker(registry, cache, options)\n\tif err != nil {\n\t\t_ = cache.Close()\n\t\treturn nil, fmt.Errorf(\"create Dex Worker: %w\", err)\n\t}\n workerTarget := dexWorker.WorkerTarget()\n\tclient, err := dex.NewClient(registry, cache, dex.ClientOptions{FlowServiceAddress: flowServiceAddress, WorkerTarget: workerTarget, Logger: logger})\n\tif err != nil {\n\t\t_ = dexWorker.Stop(context.Background())\n\t\t_ = cache.Close()\n\t\treturn nil, fmt.Errorf(\"create Dex Client: %w\", err)\n\t}\n var slackTrigger *slack.MessageTriggerRunner\n if lifecycle.mode == modeWeb {\n slackTrigger, err = newSlackTrigger(configuration.Project(), client, logger)\n\tif err != nil {\n\t\t_ = client.Close()\n\t\t_ = dexWorker.Stop(context.Background())\n\t\t_ = cache.Close()\n\t\treturn nil, fmt.Errorf(\"create Slack trigger: %w\", err)\n\t}\n }\n\treturn &Worker{lifecycle: lifecycle, Client: client, SlackTrigger: slackTrigger, dexWorker: dexWorker, cache: cache}, nil\n}\n\nfunc (worker *Worker) Start() <-chan error {\n if worker.IsWorker() { return worker.startDex() }\n result := make(chan error, 1)\n ctx, cancel := context.WithCancel(context.Background())\n worker.cancel = cancel\n go func() { result <- worker.SlackTrigger.Run(ctx) }()\n return result\n}\n\nfunc (worker *Worker) Close() error {\n worker.MarkStopping()\n if worker.cancel != nil { worker.cancel() }\n\tctx, cancel := context.WithTimeout(context.Background(), 11*time.Minute)\n\tdefer cancel()\n\treturn errors.Join(worker.dexWorker.Stop(ctx), worker.Client.Close(), worker.cache.Close())\n}\n\nfunc environment(name, fallback string) string {\n\tif value := os.Getenv(name); value != \"\" {\n\t\treturn value\n\t}\n\treturn fallback\n}"
      - text: "Writing internal/worker/application.go."
        tool_uses:
          - name: write
            input:
              path: internal/worker/application.go
              content: |
                package worker

                import (
                	"github.com/superdurable/dex-template-basic-process/internal/process"
                	"github.com/superdurable/dex/sdk-go/dex"
                )

                // Application is the single list of the application's Flows with their
                // connections: the Worker and the API tests register exactly this list. List
                // every Flow here and its source file in dex-app.yaml.
                func Application(connections Connections) []dex.Flow {
                	return []dex.Flow{
                		process.TextSummaryFlow{Connection: connections.SummaryModel},
                		process.SlackMessageFlow{},
                	}
                }
      - text: "Writing cmd/server/main.go."
        tool_uses:
          - name: write
            input:
              path: cmd/server/main.go
              content: "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"os\"\n\t\"os/signal\"\n\t\"path/filepath\"\n\t\"syscall\"\n\t\"time\"\n\n\t\"github.com/superdurable/dex-connectors-library/connectors/slack\"\n\tapi \"github.com/superdurable/dex-template-basic-process/internal/api\"\n\t\"github.com/superdurable/dex-template-basic-process/internal/process\"\n\t\"github.com/superdurable/dex-template-basic-process/internal/worker\"\n)\n\nfunc main() {\n\tif err := run(); err != nil {\n\t\tslog.Error(\"application stopped\", \"error\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run() error {\n\tlogger := slog.New(slog.NewJSONHandler(os.Stderr, nil))\n\t// Step, RPC and request failures log through the default logger.\n\tslog.SetDefault(logger)\n\tworker, err := worker.New(logger)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif worker.IsWorker() { return runWorker(worker) }\n\tdefer worker.Close()\n\tapiHandler, err := api.NewHandler(worker.Client)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"create OpenAPI handler: %w\", err)\n\t}\n\thandler := http.NewServeMux()\n\thandler.Handle(slack.RelayedTriggerPath(process.SlackConnectionName), worker.SlackTrigger)\n\thandler.Handle(\"/\", applicationHandler(apiHandler))\n\tserver := &http.Server{Addr: \":\" + environment(\"PORT\", \"8080\"), Handler: handler, ReadHeaderTimeout: 5 * time.Second}\n\tworkerResult := worker.Start()\n\tserverResult := make(chan error, 1)\n\tgo func() { serverResult <- server.ListenAndServe() }()\n\tctx, stop := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)\n\tdefer stop()\n\tselect {\n\tcase <-ctx.Done():\n\tcase err := <-workerResult:\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf(\"run Dex Worker: %w\", err)\n\t\t}\n\tcase err := <-serverResult:\n\t\tif err != nil && !errors.Is(err, http.ErrServerClosed) {\n\t\t\treturn fmt.Errorf(\"run HTTP server: %w\", err)\n\t\t}\n\t}\n\tshutdown, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n\tdefer cancel()\n\treturn server.Shutdown(shutdown)\n}\n\nfunc applicationHandler(apiHandler http.Handler) http.Handler {\n\tmux := http.NewServeMux()\n\tmux.Handle(\"/api/\", apiHandler)\n\tmux.Handle(\"/\", staticHandler(\"web/dist\"))\n\treturn logServerErrors(mux)\n}\n\n// logServerErrors logs every response with a 5xx status with its method and\n// route, never a request or response body.\nfunc logServerErrors(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, request *http.Request) {\n\t\trecorder := &statusRecorder{ResponseWriter: w, status: http.StatusOK}\n\t\tnext.ServeHTTP(recorder, request)\n\t\tif recorder.status >= http.StatusInternalServerError {\n\t\t\tslog.ErrorContext(request.Context(), \"HTTP request failed\", \"method\", request.Method, \"route\", request.URL.Path, \"status\", recorder.status)\n\t\t}\n\t})\n}\n\n// statusRecorder keeps the status a handler wrote.\ntype statusRecorder struct {\n\thttp.ResponseWriter\n\tstatus int\n}\n\nfunc (recorder *statusRecorder) WriteHeader(status int) {\n\trecorder.status = status\n\trecorder.ResponseWriter.WriteHeader(status)\n}\n\nfunc staticHandler(root string) http.Handler {\n\tfiles := http.FileServer(http.Dir(root))\n\treturn http.HandlerFunc(func(w http.ResponseWriter, request *http.Request) {\n\t\tif request.Method != http.MethodGet && request.Method != http.MethodHead {\n\t\t\thttp.Error(w, \"method not allowed\", http.StatusMethodNotAllowed)\n\t\t\treturn\n\t\t}\n\t\tasset := filepath.Join(root, filepath.Clean(request.URL.Path))\n\t\tif request.URL.Path != \"/\" {\n\t\t\tif info, err := os.Stat(asset); err == nil && !info.IsDir() {\n\t\t\t\tfiles.ServeHTTP(w, request)\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t\thttp.ServeFile(w, request, filepath.Join(root, \"index.html\"))\n\t})\n}\n\nfunc environment(name, fallback string) string {\n\tif value := os.Getenv(name); value != \"\" {\n\t\treturn value\n\t}\n\treturn fallback\n}"
      - text: "Writing dex-app.yaml."
        tool_uses:
          - name: write
            input:
              path: dex-app.yaml
              content: |
                {
                  "schemaVersion": "superverse.dev/dex-app/v1",
                  "application": {
                    "port": 8080,
                    "healthPath": "/api/health"
                  },
                  "flowDefinitions": [
                    {
                      "sourcePath": "internal/process/text_summary_flow.go"
                    },
                    {
                      "sourcePath": "internal/process/slack_message_flow.go"
                    }
                  ],
                  "connectors": [
                    {
                      "connectionName": "summary-model",
                      "connectorId": "llm",
                      "modulePath": "github.com/superdurable/dex-connectors-library/connectors/superdurable/llm",
                      "version": "v0.22.1",
                      "authMethodId": "",
                      "operations": [
                        "generateText"
                      ]
                    },
                    {
                      "connectionName": "support",
                      "connectorId": "slack",
                      "modulePath": "github.com/superdurable/dex-connectors-library/connectors/slack",
                      "version": "v1.0.0",
                      "authMethodId": "",
                      "triggerBindings": [
                        {
                          "triggerName": "channelThreadCreated",
                          "bindingName": "support-message"
                        }
                      ]
                    }
                  ]
                }
      - text: "Fetching the Slack connector v1.0.0 and checking the source."
        tool_uses:
          - name: bash
            input:
              command: "(go get github.com/superdurable/dex-connectors-library/connectors/slack@v1.0.0 && go mod tidy && make check-fdg-v2 && go build ./...) > /tmp/slack-trigger.log 2>&1 || { grep -v '^$' /tmp/slack-trigger.log | tail -3 | tr '\\n' ' '; exit 1; }; grep -c 'connectors/slack v1.0.0' go.mod"
              description: "Fetch the Slack connector and check the source"
              timeout_seconds: 600
        expect_result_contains:
          - "1"
      - text: "Pushing the Slack trigger as a checkpoint: a relayed trigger has no connector mock for an API test."
        tool_uses:
          - name: commit_and_push
            input:
              summary: "Start SlackMessageFlow from relayed Slack messages of the support connection"
              verification:
                - "go build passes and the Flow definitions validate"
              blocked: true
      - text: "The Slack trigger is pushed. Select a platform Slack connection for support and bind support-message to the channel in Studio."
      - text: "The checkpoint stays as pushed; the Slack connection is configured in Studio."
      - text: "The checkpoint stays as pushed; the Slack connection is configured in Studio."
