      - text: "Fetching the Slack connector v1.0.0 and checking the source."
        tool_uses:
          - name: bash
            input:
              command: "(go get github.com/superdurable/dex-connectors-library/connectors/slack@v1.0.0 && go mod tidy && make check-fdg-v2 && go build ./...) > /tmp/slack-trigger.log 2>&1 || { grep -v '^$' /tmp/slack-trigger.log | tail -3 | tr '\\n' ' '; exit 1; }; grep -c 'connectors/slack v1.0.0' go.mod"
              description: "Fetch the Slack connector and check the source"
              timeout_seconds: 600
        expect_result_contains:
          - "1"
      - text: "Pushing the Slack trigger as a checkpoint: a relayed trigger has no connector mock for an API test."
        tool_uses:
          - name: commit_and_push
            input:
              summary: "Start SlackMessageFlow from relayed Slack messages of the support connection"
              verification:
                - "go build passes and the Flow definitions validate"
              blocked: true
