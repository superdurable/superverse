            input: {"path": "dex-app.yaml", "content": "{\n  \"schemaVersion\": \"superverse.dev/dex-app/v1\",\n  \"application\": {\n    \"port\": 8080,\n    \"healthPath\": \"/api/health\"\n  },\n  \"flowDefinitions\": [\n    {\"sourcePath\": \"internal/process/subscription_registry_flow.go\"},\n    {\"sourcePath\": \"internal/process/newsletter_campaign_flow.go\"}\n  ],\n  \"connectors\": [\n    {\n      \"connectionName\": \"newsletter-slack\",\n      \"connectorId\": \"slack\",\n      \"modulePath\": \"github.com/superdurable/dex-connectors-library/connectors/slack\",\n      \"version\": \"v1.0.0\",\n      \"authMethodId\": \"\",\n      \"triggerBindings\": [{\"triggerName\": \"channelThreadCreated\", \"bindingName\": \"publish-newsletter\"}]\n    },\n    {\n      \"connectionName\": \"newsletter-github\",\n      \"connectorId\": \"github\",\n      \"modulePath\": \"github.com/superdurable/dex-connectors-library/connectors/github\",\n      \"version\": \"v0.23.0\",\n      \"authMethodId\": \"\",\n      \"operations\": [\"listReleases\"]\n    },\n    {\n      \"connectionName\": \"newsletter-openai\",\n      \"connectorId\": \"llm\",\n      \"modulePath\": \"github.com/superdurable/dex-connectors-library/connectors/superdurable/llm\",\n      \"version\": \"v0.22.1\",\n      \"authMethodId\": \"\",\n      \"operations\": [\"generateText\"]\n    },\n    {\n      \"connectionName\": \"newsletter-gmail\",\n      \"connectorId\": \"gmail\",\n      \"modulePath\": \"github.com/superdurable/dex-connectors-library/connectors/google/gmail\",\n      \"version\": \"v0.23.0\",\n      \"authMethodId\": \"google-oauth\",\n      \"operations\": [\"sendMessage\"]\n    }\n  ]\n}\n"}
