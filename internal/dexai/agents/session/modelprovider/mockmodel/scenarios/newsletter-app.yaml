# Replays the confirmed session-99by product build through its first successful push.
# Source contents match superdurable-apps/test-newslett-99by at faebe709c6e1ffb41342fe8f6e1d76b8ca02673c.
name: newsletter-app
title: "GitHub Releases Newsletter"
description: "Builds the subscriber page and Slack-triggered release newsletter with GitHub, OpenAI and Gmail."
category: product
inputs:
  - label: "Describe the newsletter"
    message: "Build a GitHub Releases Newsletter: visitors subscribe once by email; an administrator publishes by posting publish newsletter in Slack; collect the last seven days of releases from superdurable/dex and dex-connectors-library, summarize with OpenAI and deliver individual Gmail messages with visible outcomes. Confirm requirements before changing code."
    replies:
      - text: "Here are the newsletter requirements. Please confirm them before I build the application."
        tool_uses:
          - name: confirm_requirements
            input:
              title: "GitHub Releases Newsletter"
              summary: "Visitors subscribe once; an authorized Slack message starts a release newsletter and each subscriber receives an individual Gmail delivery."
              features:
                - {id: R1, text: "The public page accepts valid email subscriptions, retains each normalized address once and gives clear feedback."}
                - {id: R2, text: "Only a selected administrator posting the exact top-level Slack message publish newsletter in the selected channel starts a campaign; duplicate delivery of that message starts none."}
                - {id: R3, text: "The campaign reads every release page from superdurable/dex and dex-connectors-library, excludes drafts, filters by the previous seven days and keeps original links."}
                - {id: R4, text: "OpenAI writes a factual newsletter from release notes, or the report clearly says there are no releases; source or model failure never sends an incomplete report."}
                - {id: R5, text: "The campaign freezes subscribers at trigger time; Gmail sends the same report to each individually and records sent, failed or uncertain delivery without automatically retrying an uncertain send."}
              connections:
                - {need: "Receive the administrator publish command", connector: slack, operations: [channelThreadCreated], status: existing, user_setup: "Authorize Slack, select the channel and administrator members in Studio."}
                - {need: "Read release pages", connector: "GitHub v0.23.0", operations: [listReleases], status: existing, user_setup: "Authorize GitHub access to the two repositories."}
                - {need: "Summarize releases", connector: "LLM v0.22.1 (OpenAI provider)", operations: [generateText], status: existing, user_setup: "Configure the OpenAI key and model."}
                - {need: "Send each newsletter email", connector: "Gmail v0.23.0", operations: [sendMessage], status: existing, user_setup: "Authorize the Gmail sender account."}
              user_setup: ["Invite the Slack app to the publishing channel and configure four TeamSpace connections."]
              acceptance: ["A subscribed test address receives a Gmail message after the authorized Slack command, and the campaign reports a successful delivery."]
  - label: "Confirm the requirements"
    requirements_confirm: true
    replies:
      - text: "I will read the application instructions and replace the template with the confirmed newsletter."
        tool_uses:
          - name: read
            input: {path: AGENTS.md}
          - name: read
            input: {path: dex-app.yaml}
          - name: read
            input: {path: internal/worker/worker.go}
      - text: "Restoring template dependencies."
        tool_uses:
          - name: bash
            input: {command: "make bootstrap", description: "Restore template dependencies", timeout_seconds: 600}
      - text: "Writing the confirmed newsletter source."
        tool_uses:
          - name: write
            input: {"path": "README.md", "content": "# Super Durable Newsletter\n\nVisitors subscribe through the application's web page. Each normalized email address is retained once in `SubscriptionRegistryFlow`.\n\nAn authorized administrator publishes a newsletter by posting exactly `publish newsletter` as a new top-level message in the configured Slack channel. The Slack message identity starts one `NewsletterCampaignFlow`; duplicate delivery of the same message does not start another campaign. The campaign freezes its subscriber list and seven-day window at the start, reads every available release page from `superdurable/dex` and `superdurable/dex-connectors-library`, excludes drafts and releases outside that window, and asks the configured OpenAI model to summarize the releases with links. If there are no releases, it sends a clear no-releases notice. It sends one Gmail message per subscriber and records sent, failed, or uncertain delivery outcomes. An uncertain Gmail response is not retried automatically.\n\n## Studio configuration\n\nConfigure these four connections in Studio before running the application:\n\n- `newsletter-slack`: authorize the Slack app, select the publishing channel and the administrator members permitted to publish. The app must be joined to that channel.\n- `newsletter-github`: authorize GitHub access for release listing.\n- `newsletter-openai`: configure the OpenAI provider for report generation.\n- `newsletter-gmail`: authorize the Google account that sends newsletter email.\n\nStudio provides Flow runs and their display. The application also exposes `GET /api/newsletters/{campaignId}` for a campaign's report and aggregate delivery status. The campaign ID derives from the Slack team, channel and message timestamp. The subscriber page uses `POST /api/subscriptions` and requires no login.\n\n## Source verification\n\n`make check-fdg-v2` validates the Flow definitions. `make test-app RUN='TestSubscriptionValidationAndDeduplication|TestNewsletter'` runs the HTTP API tests against the test Dex engine with connector mocks. These tests verify application source and do not establish that the configured Slack, GitHub, OpenAI, or Gmail accounts work. Verify those integrations in configured Preview before Live use.\n"}
          - name: write
            input: {"path": "cmd/server/main.go", "content": "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"os\"\n\t\"os/signal\"\n\t\"path/filepath\"\n\t\"syscall\"\n\t\"time\"\n\n\t\"github.com/superdurable/dex-connectors-library/connectors/slack\"\n\tapi \"github.com/superdurable/dex-template-basic-process/internal/api\"\n\t\"github.com/superdurable/dex-template-basic-process/internal/process\"\n\t\"github.com/superdurable/dex-template-basic-process/internal/worker\"\n)\n\nfunc main() {\n\tif err := run(); err != nil {\n\t\tslog.Error(\"application stopped\", \"error\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run() error {\n\tlogger := slog.New(slog.NewJSONHandler(os.Stderr, nil))\n\t// Step, RPC and request failures log through the default logger.\n\tslog.SetDefault(logger)\n\tworker, err := worker.New(logger)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer worker.Close()\n\tapiHandler, err := api.NewHandler(worker.Client)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"create OpenAPI handler: %w\", err)\n\t}\n\tserver := &http.Server{Addr: \":\" + environment(\"PORT\", \"8080\"), Handler: applicationHandler(apiHandler, worker.TriggerHandler()), ReadHeaderTimeout: 5 * time.Second}\n\tworkerResult := worker.Start()\n\tserverResult := make(chan error, 1)\n\tgo func() { serverResult <- server.ListenAndServe() }()\n\tctx, stop := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)\n\tdefer stop()\n\tselect {\n\tcase <-ctx.Done():\n\tcase err := <-workerResult:\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf(\"run Dex Worker: %w\", err)\n\t\t}\n\tcase err := <-serverResult:\n\t\tif err != nil && !errors.Is(err, http.ErrServerClosed) {\n\t\t\treturn fmt.Errorf(\"run HTTP server: %w\", err)\n\t\t}\n\t}\n\tshutdown, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n\tdefer cancel()\n\treturn server.Shutdown(shutdown)\n}\n\nfunc applicationHandler(apiHandler, triggerHandler http.Handler) http.Handler {\n\tmux := http.NewServeMux()\n\tmux.Handle(\"/api/\", apiHandler)\n\tmux.Handle(slack.RelayedTriggerPath(process.SlackConnectionName), triggerHandler)\n\tmux.Handle(\"/\", staticHandler(\"web/dist\"))\n\treturn logServerErrors(mux)\n}\n\n// logServerErrors logs every response with a 5xx status with its method and\n// route, never a request or response body.\nfunc logServerErrors(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, request *http.Request) {\n\t\trecorder := &statusRecorder{ResponseWriter: w, status: http.StatusOK}\n\t\tnext.ServeHTTP(recorder, request)\n\t\tif recorder.status >= http.StatusInternalServerError {\n\t\t\tslog.ErrorContext(request.Context(), \"HTTP request failed\", \"method\", request.Method, \"route\", request.URL.Path, \"status\", recorder.status)\n\t\t}\n\t})\n}\n\n// statusRecorder keeps the status a handler wrote.\ntype statusRecorder struct {\n\thttp.ResponseWriter\n\tstatus int\n}\n\nfunc (recorder *statusRecorder) WriteHeader(status int) {\n\trecorder.status = status\n\trecorder.ResponseWriter.WriteHeader(status)\n}\n\nfunc staticHandler(root string) http.Handler {\n\tfiles := http.FileServer(http.Dir(root))\n\treturn http.HandlerFunc(func(w http.ResponseWriter, request *http.Request) {\n\t\tif request.Method != http.MethodGet && request.Method != http.MethodHead {\n\t\t\thttp.Error(w, \"method not allowed\", http.StatusMethodNotAllowed)\n\t\t\treturn\n\t\t}\n\t\tasset := filepath.Join(root, filepath.Clean(request.URL.Path))\n\t\tif request.URL.Path != \"/\" {\n\t\t\tif info, err := os.Stat(asset); err == nil && !info.IsDir() {\n\t\t\t\tfiles.ServeHTTP(w, request)\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t\thttp.ServeFile(w, request, filepath.Join(root, \"index.html\"))\n\t})\n}\n\nfunc environment(name, fallback string) string {\n\tif value := os.Getenv(name); value != \"\" {\n\t\treturn value\n\t}\n\treturn fallback\n}\n"}
