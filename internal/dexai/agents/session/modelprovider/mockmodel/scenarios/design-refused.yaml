# A card whose Flow design breaks one rule that the schema cannot check, five times, then
# the corrected card. Each refused card is the existing invalid_user_input tool failure,
# whose message names the field and the rule, and writes no pending input: a Step served
# by a feature the card lacks, a transition to an undeclared Step, a Step that the start
# Step never reaches, a wait on an undeclared Channel, and a design whose canonical JSON
# passes 24 KiB (three Flows of thirty Steps with long explanations, written once through
# YAML anchors). The corrected card is recorded as version 1, and a closing reply ends the
# turn. The script touches no workspace file.
name: design-refused
title: "Flow design refused"
description: "Five cards whose Flow design names an undeclared Step, Channel or feature, leaves a Step unreachable or is too large, each refused as invalid user input, then the corrected card."
category: agent_error
inputs:
  - label: "Describe the change"
    message: "Plan a human approval before SaveSummaryResult saves the summary."
    replies:
      - text: "Here is the plan."
        tool_uses:
          - name: confirm_requirements
            input: &card
              title: "Summary approval"
              summary: "A person approves each generated summary in Studio before it is saved."
              features:
                - {id: R1, text: "A Step AwaitSummaryApproval holds the generated summary until a person decides."}
                - {id: R2, text: "An Approve summary Action releases that Step, which then saves the summary."}
              connections: []
              user_setup: []
              acceptance: ["The summary is saved only after Approve summary is chosen in a Studio run."]
              design:
                summary: &summary "The summary run waits after generation until a person approves it in Studio; then it is saved."
                flows:
                  - flow_type: TextSummaryFlow
                    purpose: &purpose "Summarizes a text with a model and saves it once a person approves."
                    start_step: PrepareSummary
                    steps:
                      - &prepare {step_type: PrepareSummary, group: Text intake, explanation: "Validate and keep the text before any paid model request.",
                         next: [{to: GenerateSummary, when: "the text is valid"}, {to: complete, when: "the text is empty, too long or not UTF-8"}]}
                      - &generate {step_type: GenerateSummary, group: Summary, explanation: "Ask the configured model for a short factual summary.",
                         next: [{to: AwaitSummaryApproval, when: "generated"}, {to: SaveSummaryResult, when: "truncated"},
                                {to: RecordSummaryFailure, when: "blocked, rejected, invalid or a defect"},
                                {to: RecordSummaryUncertainty, when: "the model response was lost", is_failure_route: true}]}
                      - {step_type: AwaitSummaryApproval, group: Result, explanation: &awaitExplanation "Wait for a person to approve the generated summary before it is saved.",
                         waits_for: &awaitWait {kind: action, name: ApproveSummary}, next: &awaitNext [{to: SaveSummaryResult}], features: [R1, R3]}
                      - &save {step_type: SaveSummaryResult, group: Result, explanation: "Save the summary, the model and the token usage.", next: [{to: complete}]}
                      - &failure {step_type: RecordSummaryFailure, group: Result, explanation: "Record why the model returned no usable summary.", next: [{to: complete}]}
                      - &uncertainty {step_type: RecordSummaryUncertainty, group: Result, explanation: "Record a lost model response without sending the paid request again.", next: [{to: complete}]}
                    channels: &channels [{name: SummaryApprovals, payload: "the approval"}]
                    actions: &actions [{label: "Approve summary", rpc: ApproveSummary, publishes: SummaryApprovals, permission: summary.approve}]
        expect_failure: true
        expect_failure_text: "Error: invalid_user_input"
        expect_failure_contains: ["design.flows[0].steps[2].features[1]: R3 is not a feature of this card"]
      - text: "Here is the plan without the third feature."
        tool_uses:
          - name: confirm_requirements
            input:
              <<: *card
              design:
                summary: *summary
                flows:
                  - {flow_type: TextSummaryFlow, purpose: *purpose, start_step: PrepareSummary, channels: *channels, actions: *actions,
                     steps: [*prepare, *generate,
                             {step_type: AwaitSummaryApproval, group: Result, explanation: *awaitExplanation, waits_for: *awaitWait, next: [{to: NotifyApprover}], features: [R1, R2]},
                             *save, *failure, *uncertainty]}
        expect_failure: true
        expect_failure_text: "Error: invalid_user_input"
        expect_failure_contains: ["design.flows[0].steps[2].next[0].to: NotifyApprover is not a Step of TextSummaryFlow, complete or fail"]
      - text: "Here is the plan without the notification."
        tool_uses:
          - name: confirm_requirements
            input:
              <<: *card
              design:
                summary: *summary
                flows:
                  - {flow_type: TextSummaryFlow, purpose: *purpose, start_step: PrepareSummary, channels: *channels, actions: *actions,
                     steps: [*prepare, *generate,
                             &await {step_type: AwaitSummaryApproval, group: Result, explanation: *awaitExplanation, waits_for: *awaitWait, next: *awaitNext, features: [R1, R2]},
                             *save, *failure, *uncertainty,
                             {step_type: ArchiveSummary, group: Result, explanation: "Archive the saved summary.", next: [{to: complete}]}]}
        expect_failure: true
        expect_failure_text: "Error: invalid_user_input"
        expect_failure_contains: ["design.flows[0].steps[6]: ArchiveSummary is not reachable from the start Step PrepareSummary"]
      - text: "Here is the plan without the archive."
        tool_uses:
          - name: confirm_requirements
            input:
              <<: *card
              design:
                summary: *summary
                flows:
                  - {flow_type: TextSummaryFlow, purpose: *purpose, start_step: PrepareSummary, channels: *channels, actions: *actions,
                     steps: [*prepare, *generate,
                             {step_type: AwaitSummaryApproval, group: Result, explanation: *awaitExplanation, waits_for: {kind: channel, name: SummaryReviews}, next: *awaitNext, features: [R1, R2]},
                             *save, *failure, *uncertainty]}
        expect_failure: true
        expect_failure_text: "Error: invalid_user_input"
        expect_failure_contains: ["design.flows[0].steps[2].waits_for.name: SummaryReviews is not a Channel of TextSummaryFlow"]
      - text: "Here is the plan with every related process."
        tool_uses:
          - name: confirm_requirements
            input:
              <<: *card
              design:
                summary: *summary
                flows:
                  - &big
                    flow_type: SummaryArchiveOneFlow
                    purpose: *purpose
                    start_step: S01
                    steps:
                      - {step_type: S01, group: Archive, explanation: &long "Archive one generated summary with its model, its token usage, its approval and the person who approved it, so that a later audit can show exactly what was approved, by whom and when it happened.", next: [{to: S02}]}
                      - {step_type: S02, group: Archive, explanation: *long, next: [{to: S03}]}
                      - {step_type: S03, group: Archive, explanation: *long, next: [{to: S04}]}
                      - {step_type: S04, group: Archive, explanation: *long, next: [{to: S05}]}
                      - {step_type: S05, group: Archive, explanation: *long, next: [{to: S06}]}
                      - {step_type: S06, group: Archive, explanation: *long, next: [{to: S07}]}
                      - {step_type: S07, group: Archive, explanation: *long, next: [{to: S08}]}
                      - {step_type: S08, group: Archive, explanation: *long, next: [{to: S09}]}
                      - {step_type: S09, group: Archive, explanation: *long, next: [{to: S10}]}
                      - {step_type: S10, group: Archive, explanation: *long, next: [{to: S11}]}
                      - {step_type: S11, group: Archive, explanation: *long, next: [{to: S12}]}
                      - {step_type: S12, group: Archive, explanation: *long, next: [{to: S13}]}
                      - {step_type: S13, group: Archive, explanation: *long, next: [{to: S14}]}
                      - {step_type: S14, group: Archive, explanation: *long, next: [{to: S15}]}
                      - {step_type: S15, group: Archive, explanation: *long, next: [{to: S16}]}
                      - {step_type: S16, group: Archive, explanation: *long, next: [{to: S17}]}
                      - {step_type: S17, group: Archive, explanation: *long, next: [{to: S18}]}
                      - {step_type: S18, group: Archive, explanation: *long, next: [{to: S19}]}
                      - {step_type: S19, group: Archive, explanation: *long, next: [{to: S20}]}
                      - {step_type: S20, group: Archive, explanation: *long, next: [{to: S21}]}
                      - {step_type: S21, group: Archive, explanation: *long, next: [{to: S22}]}
                      - {step_type: S22, group: Archive, explanation: *long, next: [{to: S23}]}
                      - {step_type: S23, group: Archive, explanation: *long, next: [{to: S24}]}
                      - {step_type: S24, group: Archive, explanation: *long, next: [{to: S25}]}
                      - {step_type: S25, group: Archive, explanation: *long, next: [{to: S26}]}
                      - {step_type: S26, group: Archive, explanation: *long, next: [{to: S27}]}
                      - {step_type: S27, group: Archive, explanation: *long, next: [{to: S28}]}
                      - {step_type: S28, group: Archive, explanation: *long, next: [{to: S29}]}
                      - {step_type: S29, group: Archive, explanation: *long, next: [{to: S30}]}
                      - {step_type: S30, group: Archive, explanation: *long, next: [{to: complete}]}
                  - {<<: *big, flow_type: SummaryArchiveTwoFlow}
                  - {<<: *big, flow_type: SummaryArchiveThreeFlow}
        expect_failure: true
        expect_failure_text: "Error: invalid_user_input"
        expect_failure_contains: ["of canonical JSON exceed the limit of 24576"]
      - thinking: "The corrected design declares every Step, Channel and feature it names and fits its bound."
        text: "Here is what I will build and how the process will run. Tell me in the chat if anything should change."
        tool_uses:
          - name: confirm_requirements
            input:
              <<: *card
              design:
                summary: *summary
                flows:
                  - {flow_type: TextSummaryFlow, purpose: *purpose, start_step: PrepareSummary, channels: *channels, actions: *actions,
                     steps: [*prepare, *generate, *await, *save, *failure, *uncertainty]}
      - text: "The corrected requirements and design are recorded as version 1."
