# A platform subagent opens its checkout after a remote Codex task worktree.
# The latter must remain registered while the platform helper prunes orphans.
name: remote-task-worktree-platform-keep
title: "Keep a Codex task checkout across platform takeover"
description: "A platform investigate subagent starts after the remote executor and leaves the Codex task worktree intact."
category: agent_feature
arguments:
  head: unset
inputs:
  - label: "Investigate after switching back"
    message: "Find the page heading after switching to the platform agent."
    replies:
      - expect_handoff: true
        text: "Delegating the heading check while the Codex task checkout stays open."
        tool_uses:
          - name: start_agent
            input:
              description: "Find the page heading"
              kind: investigate
              prompt: "Find the file and line defining the page heading. [[subagent:remote-task-worktree-platform-keep/heading]]"
        expect_result_contains:
          - "\"task_id\":\"agent-"
      - text: "The platform subagent is checking the page heading."
      - text: "The platform subagent found the heading."
        notification: task
subagents:
  heading:
    kind: investigate
    replies:
      - text: "Checking the page source after a short pause."
        tool_uses:
          - name: bash
            input: {command: "sleep 20; grep -rn '<h1>' web/src", description: "Find the page heading"}
        expect_result_contains:
          - "web/src/App.tsx"
      - text: "The heading is in web/src/App.tsx."
