# A foreground command keeps a real Session turn open for concurrent queue commands.
name: collaboration
title: "Collaborator commands"
description: "Hold a turn at a foreground command while two Builders and an owner exercise attribution."
category: agent_feature
test_action: "Drive authenticated commands from several accounts."
inputs:
  - label: "Wait for collaborators"
    message: "Wait while collaborators update the queue."
    replies:
      - tool_uses:
          - name: bash
            input: {command: "sleep 300", description: "Wait for collaborator commands", timeout_seconds: 600}
      - text: "The collaborator command completed."
