name: messages-wrong-model
title: "Messages protocol wrong-model"
description: "A test-only malformed Messages reply is rejected before tool execution."
category: platform_error
test_action: "Run the compatible Messages protocol check."
inputs:
  - label: "Check protocol rejection"
    message: "Check the Messages protocol rejection."
    replies:
      - protocol_fault: wrong_model
        text: "Protocol fault test."
        tool_uses:
          - name: read
            input: {path: dex-app.yaml}
