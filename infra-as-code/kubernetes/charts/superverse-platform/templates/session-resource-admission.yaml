{{- if not .Values.localKind }}
{{- $profile := (include "v2.sandboxProfiles" . | fromJson).codingProfile }}
# Defense in depth for every namespaced write made with the control-plane
# identity. RBAC supplies a small positive permission set; this policy then
# rejects every operation/GVR/name outside the immutable coding profile contract.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "v2.product" $ }}-coding-session-write-envelope
  labels:
    app.kubernetes.io/part-of: {{ include "v2.product" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["*/*"]
        scope: Namespaced
  matchConditions:
    {{- include "v2.serverOnlyMatch" $ | nindent 4 }}
    - name: coding-session-namespace-only
      expression: "request.namespace.matches('{{ include "v2.sessionNamespacePattern" $ }}')"
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    # One write as group/version/resource/name; the core group is empty.
    - name: write
      expression: >-
        request.resource.group + '/' + request.resource.version + '/' +
        request.resource.resource + '/' + variables.target.metadata.name
    - name: isPreviewService
      expression: variables.write == '/v1/services/preview-app'
    - name: isPreviewNetworkPolicy
      expression: variables.write == 'networking.k8s.io/v1/networkpolicies/allow-preview-app'
    - name: isPreviewRoute
      expression: variables.write == 'gateway.networking.k8s.io/v1/httproutes/preview-app'
    - name: isPreviewResource
      expression: >-
        variables.isPreviewService || variables.isPreviewNetworkPolicy || variables.isPreviewRoute
  validations:
    - expression: >-
        (!has(request.subResource) || request.subResource == '') &&
        ((request.operation == 'CREATE' && variables.write in [
            'rbac.authorization.k8s.io/v1/rolebindings/{{ include "v2.product" $ }}-session-manager',
            '/v1/serviceaccounts/{{ $profile.serviceAccountName }}',
            '/v1/resourcequotas/coding-sandbox-quota',
            '/v1/limitranges/coding-sandbox-limits',
            'networking.k8s.io/v1/networkpolicies/default-deny',
            'networking.k8s.io/v1/networkpolicies/allow-{{ include "v2.product" $ }}-to-sandboxd',
            'networking.k8s.io/v1/networkpolicies/allow-preview-app',
            'networking.k8s.io/v1/networkpolicies/allow-sandbox-dns-and-public-https',
            '/v1/services/preview-app',
            'gateway.networking.k8s.io/v1/httproutes/preview-app',
            '/v1/persistentvolumeclaims/{{ $profile.workspace.pvcName }}',
            'agents.x-k8s.io/v1beta1/sandboxes/{{ $profile.sandboxName }}']) ||
        (request.operation == 'DELETE' && variables.write in [
            '/v1/persistentvolumeclaims/{{ $profile.workspace.pvcName }}',
            '/v1/services/preview-app',
            'networking.k8s.io/v1/networkpolicies/allow-preview-app',
            'gateway.networking.k8s.io/v1/httproutes/preview-app',
            'agents.x-k8s.io/v1beta1/sandboxes/{{ $profile.sandboxName }}']))
      message: The control plane may perform only {{ $profile.name }} create and explicit cleanup writes.
    - expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) &&
        namespaceObject.metadata.labels['superdurable.io/purpose'] ==
          'coding-sandbox-sessions' &&
        namespaceObject.metadata.labels['superdurable.io/sandbox-profile'] == '{{ $profile.name }}' &&
        namespaceObject.metadata.labels['app.kubernetes.io/managed-by'] == '{{ include "v2.product" $ }}' &&
        namespaceObject.metadata.labels['superdurable.io/scope'] == 'preview' &&
        namespaceObject.metadata.name == '{{ include "v2.sessionNamespacePrefix" $ }}' + namespaceObject.metadata.labels['superdurable.io/project-id'] &&
        namespaceObject.metadata.labels['superdurable.io/project-id'].matches(
          '^[a-z0-9]{1,32}$')
      message: Namespaced writes require the authoritative canonical session namespace.
    # A Sandbox keeps the image contract revision it was created with, so its
    # deletion admits any earlier revision; creation requires the current one.
    - expression: >-
        has(variables.target.metadata.labels) &&
        variables.target.metadata.namespace == namespaceObject.metadata.name &&
        variables.target.metadata.labels['app.kubernetes.io/managed-by'] == '{{ include "v2.product" $ }}' &&
        variables.target.metadata.labels['superdurable.io/sandbox-profile'] == '{{ $profile.name }}' &&
        variables.target.metadata.labels['superdurable.io/generation'].matches('^[1-9][0-9]*$') &&
        variables.target.metadata.labels['superdurable.io/scope'] ==
          namespaceObject.metadata.labels['superdurable.io/scope'] &&
        variables.target.metadata.labels['superdurable.io/project-id'] ==
          namespaceObject.metadata.labels['superdurable.io/project-id'] &&
        (variables.isPreviewResource ?
          (size(variables.target.metadata.labels) == 7 &&
           variables.target.metadata.labels['app.kubernetes.io/part-of'] == '{{ include "v2.product" $ }}' &&
           variables.target.metadata.labels['app.kubernetes.io/component'] == 'session-preview') :
          (((request.resource.group == '' &&
             request.resource.resource == 'persistentvolumeclaims') &&
            size(variables.target.metadata.labels) == 5) ||
           ((request.resource.group == 'agents.x-k8s.io' &&
             request.resource.resource == 'sandboxes') &&
            size(variables.target.metadata.labels) == 7 &&
            (request.operation == 'DELETE' ?
              variables.target.metadata.labels['superdurable.io/sandbox-image-contract-revision'].matches('^[1-9][0-9]*$') :
              variables.target.metadata.labels['superdurable.io/sandbox-image-contract-revision'] == '{{ $profile.sandboxImageContractRevision }}') &&
            variables.target.metadata.labels['superdurable.io/workspace-request-id'].matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')) ||
           (!((request.resource.group == '' &&
                request.resource.resource == 'persistentvolumeclaims') ||
              (request.resource.group == 'agents.x-k8s.io' &&
                request.resource.resource == 'sandboxes')) &&
            size(variables.target.metadata.labels) == 7 &&
            variables.target.metadata.labels['app.kubernetes.io/name'] ==
              '{{ include "v2.product" $ }}-agent-sandbox-session-baseline' &&
            variables.target.metadata.labels['app.kubernetes.io/part-of'] == '{{ include "v2.product" $ }}')))
      message: Namespaced resources require their exact {{ $profile.name }} ownership-label shape.
    - expression: >-
        request.operation != 'CREATE' ||
        ((!has(object.metadata.generateName) || object.metadata.generateName == '') &&
          (!has(object.metadata.ownerReferences) ||
            size(object.metadata.ownerReferences) == 0) &&
          ((!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0) ||
            (variables.write == '/v1/persistentvolumeclaims/{{ $profile.workspace.pvcName }}' &&
              has(object.metadata.finalizers) &&
              object.metadata.finalizers == ['kubernetes.io/pvc-protection'])) &&
          (!has(object.metadata.annotations) || size(object.metadata.annotations) == 0))
      message: >-
        {{ $profile.name }} create requests may not inject metadata side channels
        or ownership; only the workspace PVC may carry the singleton Kubernetes
        PVC protection finalizer.
    # A route object is replaced when the platform's spec of it changes, so
    # its deletion is admitted by name and ownership labels alone, whatever
    # spec an earlier release created it with.
    - expression: >-
        request.operation == 'DELETE' || !variables.isPreviewService ||
        (size(variables.target.spec.selector) == 5 &&
         variables.target.spec.selector['app.kubernetes.io/managed-by'] == '{{ include "v2.product" $ }}' &&
         variables.target.spec.selector['superdurable.io/generation'] == variables.target.metadata.labels['superdurable.io/generation'] &&
         variables.target.spec.selector['superdurable.io/scope'] ==
           namespaceObject.metadata.labels['superdurable.io/scope'] &&
         variables.target.spec.selector['superdurable.io/project-id'] ==
           namespaceObject.metadata.labels['superdurable.io/project-id'] &&
         variables.target.spec.selector['superdurable.io/sandbox-profile'] == '{{ $profile.name }}' &&
         size(variables.target.spec.ports) == 1 &&
         variables.target.spec.ports[0].name == 'http' &&
         variables.target.spec.ports[0].protocol == 'TCP' &&
         variables.target.spec.ports[0].port == 3000 &&
         variables.target.spec.ports[0].targetPort == 3000 &&
         ((variables.target.spec.type == 'NodePort' &&
           (!has(variables.target.spec.ports[0].nodePort) ||
            (variables.target.spec.ports[0].nodePort >= 30000 &&
             variables.target.spec.ports[0].nodePort <= 30127))) ||
          (variables.target.spec.type == 'ClusterIP' &&
           !has(variables.target.spec.ports[0].nodePort))))
      message: Preview Service may expose only application port 3000.
    - expression: >-
        request.operation == 'DELETE' || !variables.isPreviewNetworkPolicy ||
        (size(variables.target.spec.podSelector.matchLabels) == 5 &&
         variables.target.spec.podSelector.matchLabels['app.kubernetes.io/managed-by'] == '{{ include "v2.product" $ }}' &&
         variables.target.spec.podSelector.matchLabels['superdurable.io/generation'] == variables.target.metadata.labels['superdurable.io/generation'] &&
         variables.target.spec.podSelector.matchLabels['superdurable.io/scope'] ==
           namespaceObject.metadata.labels['superdurable.io/scope'] &&
         variables.target.spec.podSelector.matchLabels['superdurable.io/project-id'] ==
           namespaceObject.metadata.labels['superdurable.io/project-id'] &&
         variables.target.spec.podSelector.matchLabels['superdurable.io/sandbox-profile'] == '{{ $profile.name }}' &&
         variables.target.spec.policyTypes == ['Ingress'] &&
         (!has(variables.target.spec.egress) || size(variables.target.spec.egress) == 0) &&
         size(variables.target.spec.ingress) == 1 &&
         (!has(variables.target.spec.ingress[0].from) ||
           size(variables.target.spec.ingress[0].from) == 0) &&
         size(variables.target.spec.ingress[0].ports) == 1 &&
         variables.target.spec.ingress[0].ports[0].protocol == 'TCP' &&
         variables.target.spec.ingress[0].ports[0].port == 3000)
      message: Preview NetworkPolicy may admit only application port 3000.
    # The host and the parent Gateway are fixed by templates/project-route-admission.yaml.
    - expression: >-
        request.operation == 'DELETE' || !variables.isPreviewRoute ||
        (size(variables.target.spec.rules) == 1 &&
         size(variables.target.spec.rules[0].backendRefs) == 1 &&
         variables.target.spec.rules[0].backendRefs[0].name == 'preview-app' &&
         variables.target.spec.rules[0].backendRefs[0].port == 3000)
      message: The Preview route forwards only to the Preview application's Service.
---
{{ include "v2.policyBinding" (dict "root" $ "name" "coding-session-write-envelope") }}

# The coding ServiceAccount is deliberately credential-free.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "v2.product" $ }}-coding-session-service-account
  labels:
    app.kubernetes.io/part-of: {{ include "v2.product" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts"]
        scope: Namespaced
  matchConditions:
    {{- include "v2.serverOnlyMatch" $ | nindent 4 }}
  validations:
    - expression: >-
        has(object.automountServiceAccountToken) &&
        object.automountServiceAccountToken == false &&
        (!has(object.secrets) || size(object.secrets) == 0) &&
        (!has(object.imagePullSecrets) || size(object.imagePullSecrets) == 0)
      message: The coding ServiceAccount must not expose Kubernetes credentials.
---
{{ include "v2.policyBinding" (dict "root" $ "name" "coding-session-service-account") }}

# Quota values are pinned with the coding profile and cannot be weakened per session.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "v2.product" $ }}-coding-session-resource-quota
  labels:
    app.kubernetes.io/part-of: {{ include "v2.product" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["resourcequotas"]
        scope: Namespaced
  matchConditions:
    {{- include "v2.serverOnlyMatch" $ | nindent 4 }}
  validations:
    - expression: >-
        has(object.spec.hard) && size(object.spec.hard) == 12 &&
        quantity(object.spec.hard['count/sandboxes.agents.x-k8s.io']).compareTo(
          quantity('{{ $profile.namespaceBaseline.quota.maxSandboxes }}')) == 0 &&
        quantity(object.spec.hard['pods']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.pods }}')) == 0 &&
        quantity(object.spec.hard['services']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.services }}')) == 0 &&
        quantity(object.spec.hard['persistentvolumeclaims']).compareTo(
          quantity('{{ $profile.namespaceBaseline.quota.persistentVolumeClaims }}')) == 0 &&
        quantity(object.spec.hard['secrets']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.secrets }}')) == 0 &&
        quantity(object.spec.hard['requests.cpu']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.requestsCpu }}')) == 0 &&
        quantity(object.spec.hard['requests.memory']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.requestsMemory }}')) == 0 &&
        quantity(object.spec.hard['limits.cpu']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.limitsCpu }}')) == 0 &&
        quantity(object.spec.hard['limits.memory']).compareTo(quantity('{{ $profile.namespaceBaseline.quota.limitsMemory }}')) == 0 &&
        quantity(object.spec.hard['requests.ephemeral-storage']).compareTo(
          quantity('{{ $profile.namespaceBaseline.quota.requestsEphemeralStorage }}')) == 0 &&
        quantity(object.spec.hard['limits.ephemeral-storage']).compareTo(
          quantity('{{ $profile.namespaceBaseline.quota.limitsEphemeralStorage }}')) == 0 &&
        quantity(object.spec.hard['requests.storage']).compareTo(
          quantity('{{ $profile.namespaceBaseline.quota.requestsStorage }}')) == 0 &&
        (!has(object.spec.scopes) || size(object.spec.scopes) == 0) &&
        !has(object.spec.scopeSelector)
      message: The {{ $profile.name }} ResourceQuota must equal the immutable profile limits.
---
{{ include "v2.policyBinding" (dict "root" $ "name" "coding-session-resource-quota") }}

# LimitRange defaults and maxima are fixed by the immutable coding profile.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "v2.product" $ }}-coding-session-limit-range
  labels:
    app.kubernetes.io/part-of: {{ include "v2.product" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["limitranges"]
        scope: Namespaced
  matchConditions:
    {{- include "v2.serverOnlyMatch" $ | nindent 4 }}
  validations:
    - expression: >-
        has(object.spec.limits) && size(object.spec.limits) == 2 &&
        object.spec.limits.exists_one(l,
          l.type == 'Container' &&
          has(l.defaultRequest) && size(l.defaultRequest) == 3 &&
          quantity(l.defaultRequest['cpu']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.defaultRequest "cpu") }}')) == 0 &&
          quantity(l.defaultRequest['memory']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.defaultRequest "memory") }}')) == 0 &&
          quantity(l.defaultRequest['ephemeral-storage']).compareTo(
            quantity('{{ (index $profile.namespaceBaseline.limits.container.defaultRequest "ephemeral-storage") }}')) == 0 &&
          has(l.default) && size(l.default) == 3 &&
          quantity(l.default['cpu']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.default "cpu") }}')) == 0 &&
          quantity(l.default['memory']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.default "memory") }}')) == 0 &&
          quantity(l.default['ephemeral-storage']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.default "ephemeral-storage") }}')) == 0 &&
          has(l.min) && size(l.min) == 2 &&
          quantity(l.min['cpu']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.min "cpu") }}')) == 0 &&
          quantity(l.min['memory']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.min "memory") }}')) == 0 &&
          has(l.max) && size(l.max) == 3 &&
          quantity(l.max['cpu']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.max "cpu") }}')) == 0 &&
          quantity(l.max['memory']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.max "memory") }}')) == 0 &&
          quantity(l.max['ephemeral-storage']).compareTo(quantity('{{ (index $profile.namespaceBaseline.limits.container.max "ephemeral-storage") }}')) == 0 &&
          !has(l.maxLimitRequestRatio)) &&
        object.spec.limits.exists_one(l,
          l.type == 'PersistentVolumeClaim' &&
          !has(l.defaultRequest) && !has(l.default) &&
          has(l.min) && size(l.min) == 1 &&
          quantity(l.min['storage']).compareTo(quantity('{{ $profile.namespaceBaseline.limits.persistentVolumeClaim.minStorage }}')) == 0 &&
          has(l.max) && size(l.max) == 1 &&
          quantity(l.max['storage']).compareTo(quantity('{{ $profile.namespaceBaseline.limits.persistentVolumeClaim.maxStorage }}')) == 0 &&
          !has(l.maxLimitRequestRatio))
      message: The {{ $profile.name }} LimitRange must equal the immutable profile limits.
---
{{ include "v2.policyBinding" (dict "root" $ "name" "coding-session-limit-range") }}

# All four NetworkPolicies are exact.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "v2.product" $ }}-coding-session-network-policy
  labels:
    app.kubernetes.io/part-of: {{ include "v2.product" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["networkpolicies"]
        scope: Namespaced
  matchConditions:
    {{- include "v2.serverOnlyMatch" $ | nindent 4 }}
    - name: coding-session-namespace-only
      expression: "request.namespace.matches('{{ include "v2.sessionNamespacePattern" $ }}')"
  variables:
    - name: target
      expression: object
  validations:
    - expression: >-
        has(object.spec.podSelector) &&
        ((object.metadata.name == 'default-deny' &&
          (!has(object.spec.podSelector.matchLabels) ||
            size(object.spec.podSelector.matchLabels) == 0) &&
          (!has(object.spec.podSelector.matchExpressions) ||
            size(object.spec.podSelector.matchExpressions) == 0) &&
          has(object.spec.policyTypes) && size(object.spec.policyTypes) == 2 &&
          'Ingress' in object.spec.policyTypes && 'Egress' in object.spec.policyTypes &&
          (!has(object.spec.ingress) || size(object.spec.ingress) == 0) &&
          (!has(object.spec.egress) || size(object.spec.egress) == 0)) ||
        (object.metadata.name == 'allow-{{ include "v2.product" $ }}-to-sandboxd' &&
          has(object.spec.podSelector.matchLabels) &&
          size(object.spec.podSelector.matchLabels) == 1 &&
          object.spec.podSelector.matchLabels['superdurable.io/sandbox-profile'] ==
            '{{ $profile.name }}' &&
          (!has(object.spec.podSelector.matchExpressions) ||
            size(object.spec.podSelector.matchExpressions) == 0) &&
          has(object.spec.policyTypes) && size(object.spec.policyTypes) == 1 &&
          object.spec.policyTypes[0] == 'Ingress' &&
          (!has(object.spec.egress) || size(object.spec.egress) == 0) &&
          has(object.spec.ingress) && size(object.spec.ingress) == 1 &&
          has(object.spec.ingress[0].from) && size(object.spec.ingress[0].from) == 1 &&
          has(object.spec.ingress[0].from[0].namespaceSelector) &&
          !has(object.spec.ingress[0].from[0].ipBlock) &&
          has(object.spec.ingress[0].from[0].namespaceSelector.matchLabels) &&
          size(object.spec.ingress[0].from[0].namespaceSelector.matchLabels) == 1 &&
          object.spec.ingress[0].from[0].namespaceSelector.matchLabels[
            'kubernetes.io/metadata.name'] == '{{ include "v2.namespace" $ }}' &&
          (!has(object.spec.ingress[0].from[0].namespaceSelector.matchExpressions) ||
            size(object.spec.ingress[0].from[0].namespaceSelector.matchExpressions) == 0) &&
          has(object.spec.ingress[0].from[0].podSelector) &&
          has(object.spec.ingress[0].from[0].podSelector.matchLabels) &&
          size(object.spec.ingress[0].from[0].podSelector.matchLabels) == 1 &&
          object.spec.ingress[0].from[0].podSelector.matchLabels[
            'app'] == '{{ index $profile.namespaceBaseline.platformServer.podSelector "app" }}' &&
          (!has(object.spec.ingress[0].from[0].podSelector.matchExpressions) ||
            size(object.spec.ingress[0].from[0].podSelector.matchExpressions) == 0) &&
          has(object.spec.ingress[0].ports) && size(object.spec.ingress[0].ports) == 3 &&
          object.spec.ingress[0].ports.exists_one(p,
            p.protocol == 'TCP' && p.port == {{ $profile.sandboxd.restPort }} && !has(p.endPort)) &&
          object.spec.ingress[0].ports.exists_one(p,
            p.protocol == 'TCP' && p.port == {{ $profile.sandboxd.grpcPort }} && !has(p.endPort)) &&
          object.spec.ingress[0].ports.exists_one(p,
            p.protocol == 'TCP' && p.port == {{ $profile.preview.dexPort }} && !has(p.endPort))) ||
        (object.metadata.name == 'allow-sandbox-dns-and-public-https' &&
          has(object.spec.podSelector.matchLabels) &&
          size(object.spec.podSelector.matchLabels) == 1 &&
          object.spec.podSelector.matchLabels['superdurable.io/sandbox-profile'] ==
            '{{ $profile.name }}' &&
          (!has(object.spec.podSelector.matchExpressions) ||
            size(object.spec.podSelector.matchExpressions) == 0) &&
          object.spec.policyTypes == ['Egress'] &&
          (!has(object.spec.ingress) || size(object.spec.ingress) == 0) &&
          has(object.spec.egress) && size(object.spec.egress) == 4 &&
          object.spec.egress.exists_one(rule,
            has(rule.to) && size(rule.to) == 1 &&
            has(rule.to[0].namespaceSelector.matchLabels) &&
            size(rule.to[0].namespaceSelector.matchLabels) == 1 &&
            rule.to[0].namespaceSelector.matchLabels[
              'kubernetes.io/metadata.name'] == '{{ include "v2.namespace" $ }}' &&
            (!has(rule.to[0].namespaceSelector.matchExpressions) ||
              size(rule.to[0].namespaceSelector.matchExpressions) == 0) &&
            has(rule.to[0].podSelector.matchLabels) &&
            size(rule.to[0].podSelector.matchLabels) == 1 &&
            rule.to[0].podSelector.matchLabels['app'] ==
              '{{ index $profile.namespaceBaseline.platformServer.podSelector "app" }}' &&
            (!has(rule.to[0].podSelector.matchExpressions) ||
              size(rule.to[0].podSelector.matchExpressions) == 0) &&
            !has(rule.to[0].ipBlock) &&
            has(rule.ports) && size(rule.ports) == 1 &&
            rule.ports[0].protocol == 'TCP' && rule.ports[0].port == {{ $profile.namespaceBaseline.platformServer.credentialReadPort }} &&
            !has(rule.ports[0].endPort)) &&
          object.spec.egress.exists_one(rule,
            has(rule.to) && size(rule.to) == 1 && has(rule.to[0].ipBlock) &&
            rule.to[0].ipBlock.cidr == '169.254.170.23/32' && !has(rule.to[0].ipBlock.except) &&
            !has(rule.to[0].namespaceSelector) && !has(rule.to[0].podSelector) &&
            has(rule.ports) && size(rule.ports) == 1 &&
            rule.ports[0].protocol == 'TCP' && rule.ports[0].port == 80 && !has(rule.ports[0].endPort)) &&
          object.spec.egress.exists_one(rule,
            has(rule.to) && size(rule.to) == 1 &&
            has(rule.to[0].namespaceSelector.matchLabels) &&
            size(rule.to[0].namespaceSelector.matchLabels) == 1 &&
            rule.to[0].namespaceSelector.matchLabels[
              'kubernetes.io/metadata.name'] == 'kube-system' &&
            has(rule.to[0].podSelector.matchLabels) &&
            size(rule.to[0].podSelector.matchLabels) == 1 &&
            rule.to[0].podSelector.matchLabels['k8s-app'] == 'kube-dns' &&
            !has(rule.to[0].ipBlock) &&
            has(rule.ports) && size(rule.ports) == 2 &&
            rule.ports.exists_one(p,
              p.protocol == 'UDP' && p.port == 53 && !has(p.endPort)) &&
            rule.ports.exists_one(p,
              p.protocol == 'TCP' && p.port == 53 && !has(p.endPort))) &&
          object.spec.egress.exists_one(rule,
            has(rule.to) && size(rule.to) == 1 &&
            !has(rule.to[0].namespaceSelector) && !has(rule.to[0].podSelector) &&
            has(rule.to[0].ipBlock) && rule.to[0].ipBlock.cidr == '{{ $profile.namespaceBaseline.publicHttpsEgress.cidr }}' &&
            has(rule.to[0].ipBlock.except) &&
            rule.to[0].ipBlock.except == {{ $profile.namespaceBaseline.publicHttpsEgress.except | toJson }} &&
            has(rule.ports) && size(rule.ports) == 1 &&
            rule.ports[0].protocol == 'TCP' && rule.ports[0].port == 443 &&
            !has(rule.ports[0].endPort))) ||
        (object.metadata.name == 'allow-preview-app' &&
          has(object.spec.podSelector.matchLabels) &&
          size(object.spec.podSelector.matchLabels) == 5 &&
          object.spec.podSelector.matchLabels['app.kubernetes.io/managed-by'] == '{{ include "v2.product" $ }}' &&
          object.spec.podSelector.matchLabels['superdurable.io/generation'] == object.metadata.labels['superdurable.io/generation'] &&
          object.spec.podSelector.matchLabels['superdurable.io/scope'] ==
            namespaceObject.metadata.labels['superdurable.io/scope'] &&
          object.spec.podSelector.matchLabels['superdurable.io/project-id'] ==
            namespaceObject.metadata.labels['superdurable.io/project-id'] &&
          object.spec.podSelector.matchLabels['superdurable.io/sandbox-profile'] ==
            '{{ $profile.name }}' &&
          (!has(object.spec.podSelector.matchExpressions) ||
            size(object.spec.podSelector.matchExpressions) == 0) &&
          has(object.spec.policyTypes) && size(object.spec.policyTypes) == 1 &&
          object.spec.policyTypes[0] == 'Ingress' &&
          (!has(object.spec.egress) || size(object.spec.egress) == 0) &&
          has(object.spec.ingress) && size(object.spec.ingress) == 1 &&
          (!has(object.spec.ingress[0].from) ||
            size(object.spec.ingress[0].from) == 0) &&
          has(object.spec.ingress[0].ports) &&
          size(object.spec.ingress[0].ports) == 1 &&
          object.spec.ingress[0].ports[0].protocol == 'TCP' &&
          object.spec.ingress[0].ports[0].port == 3000 &&
          !has(object.spec.ingress[0].ports[0].endPort)))
      message: NetworkPolicy must equal one of the four exact {{ $profile.name }} policies.
---
{{ include "v2.policyBinding" (dict "root" $ "name" "coding-session-network-policy") }}

# The only durable volume is a fresh single-writer workspace of the profile's class and size, with no data source.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "v2.product" $ }}-project-session-workspace
  labels:
    app.kubernetes.io/part-of: {{ include "v2.product" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumeclaims"]
        scope: Namespaced
  matchConditions:
    {{- include "v2.serverOnlyMatch" $ | nindent 4 }}
  validations:
    - expression: >-
        has(object.spec.accessModes) && size(object.spec.accessModes) == 1 &&
        object.spec.accessModes[0] == '{{ $profile.workspace.accessMode }}' &&
        has(object.spec.storageClassName) && object.spec.storageClassName == '{{ $profile.workspace.storageClassName }}' &&
        (!has(object.spec.volumeMode) || object.spec.volumeMode == 'Filesystem') &&
        has(object.spec.resources) && has(object.spec.resources.requests) &&
        size(object.spec.resources.requests) == 1 &&
        quantity(object.spec.resources.requests['storage']).compareTo(
          quantity('{{ $profile.workspace.size }}')) == 0 &&
        (!has(object.spec.resources.limits) ||
          size(object.spec.resources.limits) == 0) &&
        !has(object.spec.selector) && !has(object.spec.dataSource) &&
        !has(object.spec.dataSourceRef) &&
        !has(object.spec.volumeAttributesClassName) &&
        (!has(object.spec.volumeName) || object.spec.volumeName == '')
      message: The workspace PVC must equal the fresh immutable {{ $profile.name }} volume contract.
---
{{ include "v2.policyBinding" (dict "root" $ "name" "project-session-workspace") }}

{{- end }}
