{{- if not .Values.localKind }}
# gp3 through the EBS CSI driver. The cluster's stock gp2 class predates the
# driver and is slower and pricier per GiB; new PVCs should name this class
# explicitly. Not marked default to avoid changing behavior of claims that
# omit a class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete

{{- end }}
