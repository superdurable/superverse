{{- if .Values.dex.debugIngress.enabled }}
{{- range $surface := list (dict "name" "server" "port" 8801 "hostname" (printf "dex-server.%s" (include "v2.domain" .)) "protocol" "GRPC" "health" "/AWS.ALB/healthcheck" "success" "12" "order" "10") (dict "name" "web" "port" 8802 "hostname" (printf "dex-web.%s" (include "v2.domain" .)) "protocol" "HTTP1" "health" "/readyz" "success" "200" "order" "20") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "v2.product" $ }}-platform-dex-{{ $surface.name }}
  namespace: {{ include "v2.namespace" $ }}
  labels: {app.kubernetes.io/part-of: {{ include "v2.product" $ }}, superdurable.io/scope: platform-debug}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ include "v2.product" $ }}-platform
    alb.ingress.kubernetes.io/group.order: {{ $surface.order | quote }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ $.Values.dex.debugIngress.certificateArn | quote }}
    # Public operator access is explicitly authorized for hosted test/staging.
    alb.ingress.kubernetes.io/inbound-cidrs: "0.0.0.0/0"
    alb.ingress.kubernetes.io/ip-address-type: ipv4
    alb.ingress.kubernetes.io/subnets: {{ join "," $.Values.dex.debugIngress.subnetIDs | quote }}
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/backend-protocol-version: {{ $surface.protocol }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ $surface.health | quote }}
    alb.ingress.kubernetes.io/success-codes: {{ $surface.success | quote }}
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=true,idle_timeout.timeout_seconds=120
    external-dns.alpha.kubernetes.io/hostname: {{ $surface.hostname | quote }}
spec:
  ingressClassName: {{ $.Values.dex.debugIngress.className }}
  rules:
    - host: {{ $surface.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "v2.product" $ }}-dex
                port: {number: {{ $surface.port }}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "v2.product" $ }}-platform-dex-debug
  namespace: {{ include "v2.namespace" $ }}
spec:
  podSelector: {matchLabels: {app: {{ include "v2.product" $ }}-dex}}
  policyTypes: [Ingress]
  ingress:
    # Retain platform Go Server/Worker access independently of public ALB sources.
    - from:
        {{- range .Values.dex.internalClientCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{port: 8801, protocol: TCP}]
    - from:
        {{- range .Values.dex.debugIngress.targetCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{port: 8801, protocol: TCP}, {port: 8083, protocol: TCP}]
{{- end }}
