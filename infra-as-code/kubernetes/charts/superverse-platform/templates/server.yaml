{{- if .Values.server.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "v2.serverAccount" . }}
  namespace: {{ include "v2.namespace" $ }}
  labels: {app.kubernetes.io/part-of: {{ include "v2.product" $ }}}
automountServiceAccountToken: true
---
# The server's non-secret configuration: the one document that cmd/superverse-server/config loads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "v2.product" $ }}-server-config
  namespace: {{ include "v2.namespace" $ }}
  labels: {app.kubernetes.io/part-of: {{ include "v2.product" $ }}}
data:
  server.yaml: |
    {{- include "v2.serverConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "v2.product" $ }}-server
  namespace: {{ include "v2.namespace" $ }}
  labels: {app.kubernetes.io/part-of: {{ include "v2.product" $ }}}
spec:
  replicas: {{ .Values.server.replicas }}
  revisionHistoryLimit: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: {{ include "v2.product" $ }}-server}
  template:
    metadata:
      labels: {app: {{ include "v2.product" $ }}-server, app.kubernetes.io/part-of: {{ include "v2.product" $ }}, app.kubernetes.io/name: superverse-server}
      annotations:
        checksum/config: {{ toJson .Values.server | sha256sum | quote }}
        # The rendered configuration also holds what the chart derives, such as the profile name.
        checksum/server-config: {{ include "v2.serverConfig" . | sha256sum | quote }}
    spec:
      {{- include "v2.platformPodSpec" (dict "root" $ "serviceAccount" (include "v2.serverAccount" .) "automountToken" true "terminationGrace" 120) | nindent 6 }}
      initContainers:
        # Applies the pending database migrations as the schema owner before the server starts, which never migrates.
        # Only this container receives the owner's password.
        - name: migrate
          image: {{ include "v2.image" .Values.server.image | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args: [migrate]
          {{- include "v2.platformContainerSecurity" . | nindent 10 }}
          env:
            - {name: SUPERVERSE_CONFIG_FILE, value: /etc/superverse/server.yaml}
            - name: SUPERVERSE_POSTGRES_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "v2.product" $ }}-postgres, key: SUPERVERSE_POSTGRES_OWNER_PASSWORD}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: server-config, mountPath: /etc/superverse, readOnly: true}
      containers:
        - name: server
          image: {{ include "v2.image" .Values.server.image | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          {{- include "v2.platformContainerSecurity" . | nindent 10 }}
          env:
            - {name: SUPERVERSE_CONFIG_FILE, value: /etc/superverse/server.yaml}
            # Only the documented server secrets; legacy model keys never enter the Pod.
            {{- range $key := list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "GITHUB_APP_PRIVATE_KEY" "GITHUB_APP_PRIVATE_KEY_BASE64" "GITHUB_APP_PRIVATE_KEY_PATH" "SUPERVERSE_COOKIE_SIGNING_KEY" "SUPERVERSE_LOCAL_BUILD_TOKEN" "SUPERVERSE_LOCAL_BUILD_TOKEN_FILE" "SUPERVERSE_LOCAL_GIT_SIGNING_KEY" "SUPERVERSE_POSTGRES_PASSWORD" "SUPERVERSE_CONNECTOR_OAUTH_CLIENT_SECRETS" "SUPERVERSE_SLACK_SIGNING_SECRET" "SUPERVERSE_LOGIN_HOST_ISSUER_SECRET_RING" "SUPERVERSE_LOGIN_HOST_CLIENT_SECRET_RINGS" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "v2.product" $ }}-server
                  key: {{ $key }}
                  optional: true
            {{- end }}
          ports: [{name: grpc, containerPort: 8080}, {name: health, containerPort: 8082}, {name: credential-read, containerPort: {{ include "v2.credentialRead.port" . }}}, {name: slack-events, containerPort: {{ include "v2.slackEvents.port" . }}}, {name: remote-agent, containerPort: {{ include "v2.remoteAgent.port" . }}}{{ if .Values.localKind }}, {name: git-http, containerPort: {{ include "v2.localGit.port" . }}}{{ end }}]
          startupProbe: {tcpSocket: {port: health}, periodSeconds: 3, failureThreshold: 100}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10, failureThreshold: 6}
          # Keep serving during endpoint removal; SIGTERM then drains the pull Worker before listeners.
          lifecycle: {preStop: {sleep: {seconds: 15}}}
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            {{- include "v2.platformScratchMounts" . | nindent 12 }}
            - {name: server-config, mountPath: /etc/superverse, readOnly: true}
            {{- if .Values.localKind }}
            - {name: git-repositories, mountPath: {{ include "v2.localGit.mountPath" . }}}
            {{- end }}
      volumes:
        {{- include "v2.platformScratchVolumes" . | nindent 8 }}
        - name: server-config
          configMap: {name: {{ include "v2.product" $ }}-server-config, items: [{key: server.yaml, path: server.yaml}]}
        {{- if .Values.localKind }}
        # The local Git host's repositories live on the host, in the main checkout's .local/superverse-v2/git,
        # which kind up mounts into the node. Type Directory makes a cluster created without that mount fail
        # to start the Pod instead of keeping repositories on the node's own disk.
        - name: git-repositories
          hostPath: {path: {{ include "v2.localGit.nodePath" . }}, type: Directory}
        {{- end }}
{{- end }}
