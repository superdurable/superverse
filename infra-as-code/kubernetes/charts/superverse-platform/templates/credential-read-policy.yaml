{{- $profile := (include "v2.sandboxProfiles" . | fromJson).codingProfile }}
# Project applications and the Sandboxes that run Previews read TeamSpace connection credentials from the
# server's own listener, and nothing else in a project reaches the server. Rendered on every environment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "v2.product" $ }}-credential-read
  namespace: {{ include "v2.namespace" $ }}
spec:
  podSelector: {matchLabels: {app: {{ include "v2.product" $ }}-server}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/managed-by: {{ include "v2.product" $ }}}
            matchExpressions: [{key: superdurable.io/project-id, operator: Exists}]
          podSelector: {matchLabels: {superdurable.io/component: application}}
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/managed-by: {{ include "v2.product" $ }}}
            matchExpressions: [{key: superdurable.io/scope, operator: In, values: [preview]}]
          podSelector: {matchLabels: {superdurable.io/sandbox-profile: {{ $profile.name }}}}
      ports: [{port: {{ include "v2.credentialRead.port" . }}, protocol: TCP}]
{{- if .Values.localKind }}
---
# Local Kind runs none of the platform policies (network-policy.yaml), so the policy above is the first to select
# the server Pod; this one keeps its other ports open to every peer, as they were.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "v2.product" $ }}-server-local
  namespace: {{ include "v2.namespace" $ }}
spec:
  podSelector: {matchLabels: {app: {{ include "v2.product" $ }}-server}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}, {port: 8082, protocol: TCP}, {port: 50051, protocol: TCP}, {port: {{ include "v2.slackEvents.port" . }}, protocol: TCP}, {port: {{ include "v2.remoteAgent.port" . }}, protocol: TCP}, {port: {{ include "v2.localGit.port" . }}, protocol: TCP}]
{{- end }}
