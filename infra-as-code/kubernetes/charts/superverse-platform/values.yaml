environment: test
localKind: false
server:
  enabled: true
  image: {repository: "", digest: "", pullPolicy: IfNotPresent}
  replicas: 1
  # The server configuration document (cmd/superverse-server/config/README.md), rendered
  # into the <product>-server-config ConfigMap. Non-secret settings only; the chart fills the
  # addresses it owns and fixes environment, localKind and the sandbox profile.
  config: {}
  # Project model credentials belong to Session Flows. The chart imports only the
  # documented server Secret keys; no model key is a chart value or server input.
  # The limit holds 1 GiB for the file extractor child, which the server runs one at a time and which bounds its own
  # address space to 1 GiB beyond its start (internal/comm/fileextract).
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: "2", memory: 3Gi}
studio:
  # Hosted deployments require an exact hostname independent of the application/debug domain.
  hostname: ""
  enabled: true
  image: {repository: "", digest: "", pullPolicy: IfNotPresent}
  # Studio keeps no state between requests; above 1 a PodDisruptionBudget keeps one Pod serving.
  replicas: 1
  config: {}
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {cpu: "1", memory: 1Gi}
dex:
  image: {repository: docker.io/superdurable/dex-server, tag: "v1.14.2", digest: "sha256:3c4acb0b214164850810a2d9b378b4c158b5a3d46bdbf20682d00ff5364c1a50", pullPolicy: IfNotPresent}
  # More than one replica requires sharedStreamStore: the memory Stream store is per process,
  # so a Stream written on one replica is never read on another.
  replicas: 1
  # Declares that the private <product>-dex-config selects a Stream store all replicas share (redis).
  sharedStreamStore: false
  temporalAddress: ""
  internalClientCIDRs: []
  debugIngress:
    enabled: false
    className: alb
    # Operator-owned Secret containing only the htpasswd key; never put passwords or hashes in values.
    webAuthSecretName: ""
    certificateArn: ""
    subnetIDs: []
    targetCIDRs: []
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: "2", memory: 2Gi}
ingress:
  className: alb
  certificateArn: ""
  # The platform ALB's subnets: its target health checks reach the server's health port from them.
  targetCIDRs: []
network:
  kubernetesApiCIDRs: []
  dependencyCIDRs: []

platformNodeSelector: {superdurable.io/pool: platform}
localDependencies:
  temporalImage: ""
  minioImage: ""
  postgresImage: ""
  keycloakImage: ""
  keycloakOrigin: ""
sandboxController:
  namespace: {create: true, name: agent-sandbox-system}
  image:
    repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    tag: v1.0.1@sha256:e1787f95cda406e2d81322e8637b6dfa2d77514fbbd0536a872b8e5d409b7154
  nodeSelector: {superdurable.io/pool: platform}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}
  podSecurityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
  containerSecurityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
sandboxProfiles:
  # Environment inputs of the coding profile; the rest of its immutable
  # contract and its localKind settings are templates/_coding-profile.tpl.
  codingProfile:
    enabled: false
    image:
      repository: ""
      # Deploy coding Sandboxes by immutable digest, never a mutable tag.
      digest: ""
    workspace:
      size: 1Gi
nodePools:
  clusterName: ""
  nodeRoleName: ""
  gvisorRelease: ""
  gvisorSHA256: ""
  # vCPU ceilings per Karpenter pool (not spend). Terraform sets them per environment (node_pool_limits).
  # A coding Sandbox requests 100m / 256Mi; daemonsets, Pod slots and memory also bound density.
  # A pool CPU ceiling is a capacity ceiling, not a Session count or a spending limit.
  limits: {platform: 32, runsc: 160, live: 64}

hostedProjects:
  dexImage: ""
  applicationRepository: ""
  certificateArn: ""
